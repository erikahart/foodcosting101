[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    # Keep this site out of search engines; it's for your team only.
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Always check for a fresh copy of the app's pages, so updates show right away.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/tablet.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/tablet/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

# The SFTP library (GFS feed) ships parts that shouldn't be bundled; Netlify installs it as is.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ssh2-sftp-client", "ssh2", "cpu-features"]

# The no-login tablet Kitchen book: /tablet/<link code> opens tablet.html
[[redirects]]
  from = "/tablet/*"
  to = "/tablet.html"
  status = 200
