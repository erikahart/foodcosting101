<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlateMargin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1D7A5F; --on-brand:#fff;
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#14213D; --muted:#4F5B70; --line:#D3D9E2;
  --warn:#A86A00; --warn-soft:#FBEBCB; --good:#2E6B3F; --good-soft:#DDEEDF;
  --bad:#A4262C; --bad-soft:#F6DCDD; --field:#F7F9FB; --shade:rgba(20,33,61,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --panel:#16213A; --ink:#EDF1F7; --muted:#A9B4C6; --line:#2C3A57;
    --warn:#E8B04B; --warn-soft:#3A3120; --good:#7FC793; --good-soft:#1C3325;
    --bad:#F0868B; --bad-soft:#3B1D22; --field:#1C2944; --shade:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --panel:#16213A; --ink:#EDF1F7; --muted:#A9B4C6; --line:#2C3A57;
  --warn:#E8B04B; --warn-soft:#3A3120; --good:#7FC793; --good-soft:#1C3325;
  --bad:#F0868B; --bad-soft:#3B1D22; --field:#1C2944; --shade:rgba(0,0,0,.6);
}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.brandbox{display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:900;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brandbox b{display:block;font-size:1.05rem;font-weight:900;line-height:1.1}
.brandbox span{font-size:.8rem;color:var(--muted)}
.acct{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--field);font-weight:700}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
nav button:hover{background:var(--field)}
nav button[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px;font-weight:800}
nav button[aria-current="page"] .badge{background:var(--on-brand);color:var(--brand)}
.powered{margin-top:auto;font-size:.75rem;color:var(--muted)}
main{padding:24px clamp(14px,3vw,36px) 80px;max-width:1100px;width:100%}
h1{font-size:1.7rem;font-weight:900;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
h2{font-size:1.15rem;font-weight:900;margin:24px 0 10px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .n{font-size:1.9rem;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.88rem;font-weight:600}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.good .n{color:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:1.05rem;font-weight:900}
.card p{margin:0 0 10px;color:var(--muted)}
.btn{font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer;border:2px solid var(--ink);background:transparent;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.insight{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.insight .bar{background:var(--line)}
.insight.bad .bar{background:var(--bad)} .insight.warn .bar{background:var(--warn)} .insight.good .bar{background:var(--good)} .insight.push .bar{background:var(--brand)}
.insight .body{padding:14px 0}
.insight .tag{font-size:.75rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.insight h3{margin:2px 0 4px;font-size:1.05rem;font-weight:900}
.insight p{margin:0;color:var(--muted)}
.insight .imp{padding:14px 14px 14px 0;text-align:right;font-variant-numeric:tabular-nums}
.insight .imp b{display:block;font-size:1.3rem;font-weight:900}
.insight .imp span{font-size:.8rem;color:var(--muted)}
.insight .acts{margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.8rem;color:var(--muted);font-weight:800;background:var(--field)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--field)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800;background:var(--field);border:1px solid var(--line)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.brand{background:var(--brand);color:var(--on-brand);border-color:transparent}
.up{color:var(--bad);font-weight:800} .down{color:var(--good);font-weight:800}
.search{padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);min-height:44px;flex:1;min-width:180px}
.sup-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sup .top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.sup .meth{font-size:.82rem;color:var(--muted);margin:6px 0 12px}
.field{margin-bottom:12px}
.field label,.field .q{display:block;font-weight:800;margin-bottom:4px;font-size:.95rem}
.hint{display:block;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.inp{width:100%;background:var(--field);border:2px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
textarea.inp{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:var(--shade)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--panel);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-h h2{margin:0;flex:1;font-size:1.2rem}
.x{border:0;background:var(--field);border-radius:10px;width:42px;height:42px;font-size:1.4rem;cursor:pointer;flex:none}
.sheet-b{padding:16px 18px;overflow-y:auto;flex:1}
.sheet-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cost{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:14px}
.cost div{padding:10px 12px;border-right:1px solid var(--line)}
.cost div:last-child{border-right:0}
.cost b{display:block;font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums}
.cost span{font-size:.8rem;color:var(--muted);font-weight:600}
.line{display:grid;grid-template-columns:1fr 90px 90px 80px 36px;gap:6px;align-items:center;margin-bottom:6px}
.line select,.line input{border:2px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--field);min-height:40px;min-width:0;width:100%}
.line .lc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.line.bad select{border-color:var(--warn)}
.ix{border:2px solid var(--line);background:var(--panel);border-radius:8px;height:40px;cursor:pointer;color:var(--muted)}
.coachtip{background:var(--field);border-radius:12px;padding:12px 14px;margin:10px 0}
.coachtip b{display:block;margin-bottom:2px}
.ai{border:2px dashed var(--brand);border-radius:12px;padding:12px;margin-bottom:14px}
.mini{font-size:.78rem;color:var(--muted);font-weight:700}
.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.preview .ph{background:var(--brand);color:var(--on-brand);padding:14px 16px;display:flex;gap:10px;align-items:center}
.preview .ph .logo{background:var(--on-brand);color:var(--brand)}
.preview .pb{padding:14px 16px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.mobilebar{display:none}
[hidden]{display:none!important}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav button{white-space:nowrap}
  .powered{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .acctrow{display:flex;gap:8px;align-items:center}
}
@media (max-width:560px){
  .g2,.g3{grid-template-columns:1fr}
  .cost{grid-template-columns:repeat(2,1fr)}
  .cost div:nth-child(2){border-right:0}
  .cost div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .line{grid-template-columns:1fr 70px 76px 36px}
  .line .lc{display:none}
  .insight{grid-template-columns:6px 1fr}
  .insight .imp{grid-column:2;text-align:left;padding:0 14px 14px 0}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate .card{width:min(420px,100%);padding:24px}
.gate .brandbox{margin-bottom:18px}
.gate h1{font-size:1.4rem;margin:0 0 4px}
.tabs2{display:flex;gap:6px;margin:14px 0 16px}
.tabs2 button{flex:1;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:9px;font-weight:800;cursor:pointer}
.tabs2 button[aria-selected="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.good{background:var(--good-soft);color:var(--good)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;font-weight:600}
.userbox{border-top:1px solid var(--line);padding-top:12px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.userbox b{color:var(--ink);word-break:break-all}
.choice{display:grid;gap:8px;margin:6px 0 14px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:700}
.choice label span{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.choice input{margin-top:4px}
@media (max-width:900px){.userbox{flex-direction:row;flex-wrap:wrap;align-items:center;border-top:0;padding-top:0}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="card" id="gate-card"><div class="spin"></div></div></div>
<div class="app" id="app" hidden>
  <aside>
    <div class="brandbox"><div class="logo" id="logo"></div><div><b id="prod-name">PlateMargin</b><span id="prod-tag">Menu profit, made simple</span></div></div>
    <div class="acctrow">
      <label class="mini" for="acct">Location</label>
      <select class="acct" id="acct"></select>
    </div>
    <nav id="nav"></nav>
    <div class="userbox" id="userbox"></div>
    <div class="powered" id="powered"></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"><div class="sheet"><div class="sheet-h"><h2 id="dlg-t"></h2><button class="x" id="dlg-x" aria-label="Close">×</button></div><div class="sheet-b" id="dlg-b"></div><div class="sheet-f" id="dlg-f"></div></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

/* ================= Costing ================= */
function supCostPerUnit(s){ if (!s || !n(s.price) || !n(s.caseQty)) return null; return s.price / (s.caseQty * (n(s.yield) || 1)); }
function lineCost(l, r = R(), sups = r.supplies){
  const s = l.s && sups[l.s]; if (!s) return null;
  const cpu = supCostPerUnit(s); if (cpu == null) return null;
  const u = l.unit || s.unit, a = UNITS[u], b = UNITS[s.unit];
  if (!a || !b || a[0] !== b[0]) return null;
  return (n(l.qty) || 0) * a[1] / b[1] * cpu;
}
const isDrink = it => /drink|beer|bar\b|wine|cocktail|beverage|tap|draft|liquor|spirit/i.test((it && it.section) || "");
const targetFor = (it, r = R()) => isDrink(it) ? (n(r.drinkTarget) || 0.22) : (n(r.target) || 0.30);
function stats(it, r = R(), sups = r.supplies){
  const tgt = targetFor(it, r);
  let raw = 0, missing = 0;
  (it.lines || []).forEach(l => { const c = lineCost(l, r, sups); if (c == null) missing++; else raw += c; });
  const plate = raw / (n(it.portions) || 1) * (1 + r.q);
  const price = n(it.price) || 0, fc = price ? plate / price : NaN;
  const suggested = plate > 0 ? Math.ceil(plate / tgt / r.round - 1e-9) * r.round : 0;
  const profit = price - plate;
  let status = "good";
  if (missing) status = "missing"; else if (!price) status = "noprice"; else if (fc > tgt + r.tol) status = "bad"; else if (fc > tgt) status = "warn";
  return { plate, price, fc, suggested, profit, missing, status };
}
function engineering(r = R()){
  const items = Object.values(r.items).filter(i => n(i.sold) > 0 && n(i.price) > 0);
  const totalSold = items.reduce((a, i) => a + i.sold, 0);
  const st = new Map(items.map(i => [i.id, stats(i, r)]));
  const avgCM = totalSold ? items.reduce((a, i) => a + st.get(i.id).profit * i.sold, 0) / totalSold : 0;
  const popLine = items.length ? (1 / items.length) * 0.7 : 0;
  const cls = {};
  items.forEach(i => { const hiPop = i.sold / totalSold >= popLine, hiCM = st.get(i.id).profit >= avgCM; cls[i.id] = hiPop && hiCM ? "Star" : hiPop ? "Plowhorse" : hiCM ? "Puzzle" : "Dog"; });
  return { cls, avgCM, popLine, totalSold };
}
function usedBy(sid, r = R()){ return Object.values(r.items).filter(i => (i.lines||[]).some(l => l.s === sid)); }

/* ================= Profit coach (rules engine) ================= */
function insights(r = R()){
  const out = [], per = r.period, eng = engineering(r);
  Object.values(r.items).forEach(it => {
    const s = stats(it, r), sold = n(it.sold) || 0, cls = eng.cls[it.id];
    if (s.status === "missing") out.push({ sev:"warn", tag:"Cost is incomplete", title: it.name + " is missing " + s.missing + (s.missing === 1 ? " cost" : " costs"), text:"Its real cost is higher than shown, so every number for this item is too rosy. Link the missing part to a supply.", impact:null, item:it.id, score: 50 });
    if (s.status === "bad"){
      const gap = s.suggested - s.price;
      const lcs = (it.lines || []).map(l => ({ l, c: lineCost(l, r) || 0 }));
      const rawTotal = lcs.reduce((a2, x) => a2 + x.c, 0);
      const big = lcs.sort((a2,b2) => b2.c - a2.c)[0];
      const share = big && rawTotal ? big.c / rawTotal : 0;
      out.push({ sev:"bad", tag:"Losing margin", title: it.name + " is at " + pc(s.fc) + " food cost", text:"Target is " + pc(targetFor(it, r)) + ". Raise it to " + $$(s.suggested) + " (+" + $$(gap) + ")" + (big && big.c ? ", or trim the biggest cost: " + (r.supplies[big.l.s] ? r.supplies[big.l.s].name : big.l.label) + " is " + pc(share) + " of the plate." : "."), impact: gap * sold, impactLabel:"per " + per + " if raised", item:it.id, score: 100 + gap * sold });
    }
    if (cls === "Puzzle") out.push({ sev:"push", tag:"Push this", title:"Sell more " + it.name, text:"It earns " + $$(s.profit) + " a plate, " + $$(s.profit - eng.avgCM) + " more than your average, but few people order it. Move it to the top of its section, give it a better description, or have servers recommend it.", impact: s.profit * 10, impactLabel:"for 10 more sold", item:it.id, score: 80 + s.profit });
    if (cls === "Plowhorse" && s.status !== "bad") out.push({ sev:"warn", tag:"Popular, thin margin", title:"Nudge " + it.name + " up 50¢", text:"It sells well but earns only " + $$(s.profit) + " a plate. Regulars rarely notice a small rise on a favorite.", impact: 0.5 * sold, impactLabel:"per " + per, item:it.id, score: 60 + 0.5 * sold });
    if (cls === "Dog") out.push({ sev:"warn", tag:"Rethink", title: it.name + " sells little and earns little", text:"Rework it with cheaper parts, bundle it, or take it off to simplify prep and ordering.", impact:null, item:it.id, score: 40 });
    if (cls === "Star" && s.status === "good") out.push({ sev:"good", tag:"Star", title: it.name + " is a star", text:"Popular and profitable. Keep the recipe and price steady and give it the best spot on the menu.", impact: s.profit * sold, impactLabel:"profit per " + per, item:it.id, score: 10 });
  });
  Object.values(r.supplies).forEach(su => {
    const h = su.history || []; if (h.length < 2) return;
    const a = h[h.length-2].price, b = h[h.length-1].price, ch = (b - a) / a; if (ch <= 0.05) return;
    const old = Object.assign({}, r.supplies, { [su.id]: Object.assign({}, su, { price: a }) });
    let delta = 0; const names = [];
    usedBy(su.id, r).forEach(it => { const d = stats(it, r).plate - stats(it, r, old).plate; delta += d * (n(it.sold) || 0); names.push(it.name); });
    if (!names.length) return;
    out.push({ sev:"bad", tag:"Supplier price jump", title: su.name + " went up " + pc(ch), text: (su.supplier || "Supplier") + " raised it from " + $$(a) + " to " + $$(b) + " a case on " + nice(h[h.length-1].date) + ". It's in " + names.join(", ") + ".", impact: -delta, impactLabel:"cost per " + per, supply: su.id, score: 90 + delta });
  });
  return out.sort((x, y) => y.score - x.score);
}

async function shrinkImage(f){

async function readInvoiceFile(f){
