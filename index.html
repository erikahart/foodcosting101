<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>The Fox Den Staff App</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#24221F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fox Den">
<link rel="apple-touch-icon" id="touchIcon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1D7A5F; --on-brand:#fff;
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#14213D; --muted:#4F5B70; --line:#D3D9E2;
  --warn:#A86A00; --warn-soft:#FBEBCB; --good:#2E6B3F; --good-soft:#DDEEDF;
  --bad:#A4262C; --bad-soft:#F6DCDD; --field:#F7F9FB; --shade:rgba(20,33,61,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --panel:#16213A; --ink:#EDF1F7; --muted:#A9B4C6; --line:#2C3A57;
    --warn:#E8B04B; --warn-soft:#3A3120; --good:#7FC793; --good-soft:#1C3325;
    --bad:#F0868B; --bad-soft:#3B1D22; --field:#1C2944; --shade:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --panel:#16213A; --ink:#EDF1F7; --muted:#A9B4C6; --line:#2C3A57;
  --warn:#E8B04B; --warn-soft:#3A3120; --good:#7FC793; --good-soft:#1C3325;
  --bad:#F0868B; --bad-soft:#3B1D22; --field:#1C2944; --shade:rgba(0,0,0,.6);
}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.brandbox{display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:900;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brandbox b{display:block;font-size:1.05rem;font-weight:900;line-height:1.1}
.brandbox span{font-size:.8rem;color:var(--muted)}
.acct{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--field);font-weight:700}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
nav button:hover{background:var(--field)}
nav button[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px;font-weight:800}
nav button[aria-current="page"] .badge{background:var(--on-brand);color:var(--brand)}
.powered{margin-top:auto;font-size:.75rem;color:var(--muted)}
main{padding:24px clamp(14px,3vw,36px) 80px;max-width:1100px;width:100%}
h1{font-size:1.7rem;font-weight:900;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
h2{font-size:1.15rem;font-weight:900;margin:24px 0 10px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .n{font-size:1.9rem;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.88rem;font-weight:600}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.good .n{color:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:1.05rem;font-weight:900}
.card p{margin:0 0 10px;color:var(--muted)}
.btn{font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer;border:2px solid var(--ink);background:transparent;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.insight{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.insight .bar{background:var(--line)}
.insight.bad .bar{background:var(--bad)} .insight.warn .bar{background:var(--warn)} .insight.good .bar{background:var(--good)} .insight.push .bar{background:var(--brand)}
.insight .body{padding:14px 0}
.insight .tag{font-size:.75rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.insight h3{margin:2px 0 4px;font-size:1.05rem;font-weight:900}
.insight p{margin:0;color:var(--muted)}
.insight .imp{padding:14px 14px 14px 0;text-align:right;font-variant-numeric:tabular-nums}
.insight .imp b{display:block;font-size:1.3rem;font-weight:900}
.insight .imp span{font-size:.8rem;color:var(--muted)}
.insight .acts{margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.8rem;color:var(--muted);font-weight:800;background:var(--field)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--field)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800;background:var(--field);border:1px solid var(--line)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.brand{background:var(--brand);color:var(--on-brand);border-color:transparent}
.up{color:var(--bad);font-weight:800} .down{color:var(--good);font-weight:800}
.search{padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);min-height:44px;flex:1;min-width:180px}
.sup-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sup .top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.sup .meth{font-size:.82rem;color:var(--muted);margin:6px 0 12px}
.field{margin-bottom:12px}
.field label,.field .q{display:block;font-weight:800;margin-bottom:4px;font-size:.95rem}
.hint{display:block;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.inp{width:100%;background:var(--field);border:2px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
textarea.inp{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:var(--shade)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--panel);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-h h2{margin:0;flex:1;font-size:1.2rem}
.x{border:0;background:var(--field);border-radius:10px;width:42px;height:42px;font-size:1.4rem;cursor:pointer;flex:none}
.sheet-b{padding:16px 18px;overflow-y:auto;flex:1}
.sheet-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cost{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:14px}
.cost div{padding:10px 12px;border-right:1px solid var(--line)}
.cost div:last-child{border-right:0}
.cost b{display:block;font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums}
.cost span{font-size:.8rem;color:var(--muted);font-weight:600}
.line{display:grid;grid-template-columns:1fr 90px 90px 80px 36px;gap:6px;align-items:center;margin-bottom:6px}
.line select,.line input{border:2px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--field);min-height:40px;min-width:0;width:100%}
.line .lc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.line.bad select{border-color:var(--warn)}
.ix{border:2px solid var(--line);background:var(--panel);border-radius:8px;height:40px;cursor:pointer;color:var(--muted)}
.coachtip{background:var(--field);border-radius:12px;padding:12px 14px;margin:10px 0}
.coachtip b{display:block;margin-bottom:2px}
.ai{border:2px dashed var(--brand);border-radius:12px;padding:12px;margin-bottom:14px}
.mini{font-size:.78rem;color:var(--muted);font-weight:700}
.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.preview .ph{background:var(--brand);color:var(--on-brand);padding:14px 16px;display:flex;gap:10px;align-items:center}
.preview .ph .logo{background:var(--on-brand);color:var(--brand)}
.preview .pb{padding:14px 16px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.mobilebar{display:none}
[hidden]{display:none!important}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav button{white-space:nowrap}
  .powered{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .acctrow{display:flex;gap:8px;align-items:center}
}
@media (max-width:560px){
  .g2,.g3{grid-template-columns:1fr}
  .cost{grid-template-columns:repeat(2,1fr)}
  .cost div:nth-child(2){border-right:0}
  .cost div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .line{grid-template-columns:1fr 70px 76px 36px}
  .line .lc{display:none}
  .insight{grid-template-columns:6px 1fr}
  .insight .imp{grid-column:2;text-align:left;padding:0 14px 14px 0}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate .card{width:min(420px,100%);padding:24px}
.gate .brandbox{margin-bottom:18px}
.gate h1{font-size:1.4rem;margin:0 0 4px}
.tabs2{display:flex;gap:6px;margin:14px 0 16px}
.tabs2 button{flex:1;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:9px;font-weight:800;cursor:pointer}
.tabs2 button[aria-selected="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.good{background:var(--good-soft);color:var(--good)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;font-weight:600}
.userbox{border-top:1px solid var(--line);padding-top:12px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.userbox b{color:var(--ink);word-break:break-all}
.choice{display:grid;gap:8px;margin:6px 0 14px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:700}
.choice label span{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.choice input{margin-top:4px}
@media (max-width:900px){.userbox{flex-direction:row;flex-wrap:wrap;align-items:center;border-top:0;padding-top:0}}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip .ct{opacity:.7;font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.st-bad[aria-pressed="false"]{border-color:var(--bad);color:var(--bad)}
.chip.st-warn[aria-pressed="false"]{border-color:var(--warn);color:var(--warn)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
.grp-h h2{margin:0;font-size:1.15rem}
.grp-h .mini{font-weight:600}
.menu-t td,.menu-t th{padding:9px 10px}
.menu-t td:first-child,.menu-t th:first-child{width:34px;padding-right:0}
.menu-t input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.bulk{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.bulk select{min-height:38px;border-radius:8px;border:0;padding:6px 8px}
.bulk .btn{min-height:38px;border-color:var(--bg);color:var(--bg)}
.dash{color:var(--muted)}
@media (max-width:1250px){.menu-t .c-sug,.menu-t .c-cls{display:none}}
@media (max-width:1050px){.menu-t .c-sold,.menu-t .c-prof{display:none}}
@media (max-width:640px){.menu-t .c-plate{display:none}}
/* ---- Fit any screen ---- */
:root{--brand-font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,.brandbox b{font-family:var(--brand-font)}
main{min-width:0}
.tw{max-width:100%}
.tw table td{overflow-wrap:anywhere}
.spread > div:first-child{min-width:0;flex:1 1 320px}
@media (max-width:900px){
  .app{display:block}
  aside{flex-direction:column;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
  aside .brandbox{gap:8px}
  aside .brandbox .logo{width:34px;height:34px;font-size:.85rem}
  aside .brandbox span{display:none}
  .acctrow{display:flex;gap:8px;align-items:center}
  .acctrow .mini{display:none}
  .acct{min-height:38px;padding:6px 8px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;padding:8px 12px;font-size:.92rem}
  .userbox{display:none}
  main{padding:16px 14px 70px}
  h1{font-size:1.4rem}
  .lead{font-size:.95rem}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .filters .row{flex-wrap:wrap}
  .filters .search{flex:1 1 100%}
}
@media (max-width:700px){
  /* Tables become stacked cards */
  .tw{border:0;background:transparent;overflow:visible}
  .tw table{background:transparent}
  .tw thead{display:none}
  .tw tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative}
  .tw tbody td{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;padding:2px 0;white-space:normal;text-align:right;min-width:0}
  .tw tbody td::before{content:attr(data-label);color:var(--muted);font-size:.78rem;font-weight:700;text-align:left}
  .tw tbody td.cell-main{grid-column:1/-1;display:block;text-align:left;font-size:1.02rem;padding-right:34px}
  .tw tbody td.cell-main::before,.tw tbody td.cell-pick::before,.tw tbody td.cell-wide::before{display:none}
  .tw tbody td.cell-pick{position:absolute;top:10px;right:12px;padding:0}
  .tw tbody td.cell-wide{grid-column:1/-1;display:block;text-align:left}
  .tw tbody td.cell-wide select,.tw tbody td.cell-wide .inp{width:100%}
  .tw tbody td:empty{display:none}
  .menu-t .c-plate,.menu-t .c-sug,.menu-t .c-sold,.menu-t .c-cls{display:none}
  .menu-t .c-prof{display:flex}
  .grp-h{margin-top:18px}
  .bulk{border-radius:10px}
  /* Pop-ups go full screen */
  .sheet{width:100%;max-height:100%;height:100%;border-radius:0;top:0;left:0;transform:none}
  .sheet-f{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .cost b{font-size:1.1rem}
  .btn{min-height:42px}
  .spread{align-items:stretch}
  .spread > .row,.spread > .btn{width:100%}
  .spread > .row{flex-wrap:nowrap}
  .spread > .row .btn{flex:1 1 0;min-width:0;padding:8px 8px;font-size:.88rem;white-space:normal;line-height:1.15}
  .filters .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters .row .search{grid-column:1/-1}
  .filters .row select,.filters .row .btn{width:100%;max-width:none!important;min-width:0;min-height:40px;font-size:.88rem;padding:6px 8px}
}
/* Brand kit */
.kit-drop{display:block;border:3px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--field)}
.kit-drop.over{border-color:var(--brand)}
.kit-drop b{display:block;font-size:1.05rem;margin-bottom:2px}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.palette button{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px;cursor:pointer;font-size:.72rem;font-weight:700;min-width:64px}
.palette button[aria-pressed="true"]{border-color:var(--ink)}
.palette i{display:block;width:44px;height:30px;border-radius:6px;border:1px solid rgba(0,0,0,.1)}
.order-name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;letter-spacing:.01em;opacity:.85}
.setup{border:2px solid var(--brand);margin-bottom:16px}
.setup h3{margin:0 0 4px}
.setup ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.setup li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--field)}
.setup li .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--panel);border:2px solid var(--line);font-size:.85rem}
.setup li.done{opacity:.7}
.setup li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.setup li b{display:block}
.setup li span.mini{display:block}
@media (max-width:700px){.setup li{grid-template-columns:30px 1fr}.setup li .btn{grid-column:2;justify-self:start}}

/* =====================================================================
   Design pass: calm back-office tool. Stainless greys, ink sidebar,
   brand color for actions only; green/amber/red mean profit/watch/loss.
   ===================================================================== */
:root{
  --bg:#F2F4F3; --panel:#FFFFFF; --ink:#18211D; --ink-2:#3D4843; --muted:#68736E; --line:#E1E5E3; --line-2:#CDD3D0; --field:#F7F8F8;
  --good:#1F7A4D; --good-soft:#E3F2EA; --warn:#94650A; --warn-soft:#FBF1DC; --bad:#B4261E; --bad-soft:#FBE7E5;
  --side:#18211D; --side-ink:#E6ECE9; --side-muted:#93A09A; --side-line:#2B3631;
  --shade:rgba(16,22,19,.42);
  --r-panel:14px; --r-ctl:9px;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --brand-font:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --panel:#171E1B; --ink:#E7ECE9; --ink-2:#C5CEC9; --muted:#8E9A94; --line:#26302C; --line-2:#36423D; --field:#1C2421;
    --good:#6FC79A; --good-soft:#18291F; --warn:#E3B75A; --warn-soft:#2B2414; --bad:#F08A80; --bad-soft:#2E1917;
    --side:#0C100E; --side-ink:#E6ECE9; --side-muted:#7D8A84; --side-line:#1F2824; --shade:rgba(0,0,0,.6);
  }
}
body{font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
h1,h2,h3,.brandbox b{font-family:var(--brand-font);letter-spacing:-.015em}
h1{font-size:1.85rem;font-weight:700;line-height:1.15;margin:0 0 6px}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.lead{color:var(--muted);font-size:.98rem;max-width:68ch}
main{padding:30px clamp(16px,3.2vw,44px) 80px;max-width:1280px}

/* Sidebar */
aside{background:var(--side);color:var(--side-ink);border-right:0;padding:20px 14px 16px;gap:18px}
aside .brandbox b{color:#fff;font-size:1.08rem}
aside .brandbox span{color:var(--side-muted);font-size:.78rem}
aside .logo{border-radius:10px;width:40px;height:40px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.acctrow .mini{color:var(--side-muted);font-weight:500;letter-spacing:0}
.acct{background:#ffffff0d;border:1px solid var(--side-line);color:var(--side-ink);border-radius:var(--r-ctl);font-weight:600}
.acct option{color:#18211D}
nav{gap:2px}
nav button{color:var(--side-muted);font-weight:500;padding:9px 10px;border-radius:8px;gap:10px;justify-content:flex-start;position:relative}
nav button .ic{width:18px;height:18px;flex:none;opacity:.9}
nav button .lbl{flex:1}
nav button:hover{background:#ffffff0a;color:var(--side-ink)}
nav button[aria-current="page"]{background:#ffffff12;color:#fff}
nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.badge{background:var(--bad);color:#fff;font-size:.7rem;padding:1px 7px;font-weight:700}
nav button[aria-current="page"] .badge{background:var(--bad);color:#fff}
.userbox{border-top:1px solid var(--side-line);color:var(--side-muted)}
.userbox b{color:var(--side-ink);font-weight:600}
.userbox .linkbtn{color:var(--side-muted)}
.userbox select.acct{margin:2px 0}
.powered{color:var(--side-muted);opacity:.7}

/* Surfaces */
.card{border:1px solid var(--line);border-radius:var(--r-panel);padding:18px 20px;box-shadow:none}
.card p{color:var(--ink-2)}
.kpi{border:1px solid var(--line);border-radius:var(--r-panel);padding:16px 18px}
.kpi .n{font-family:var(--brand-font);font-weight:700;font-size:2rem;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-weight:500;font-size:.85rem}

/* Controls */
.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:var(--r-ctl);font-weight:600;min-height:40px;padding:8px 14px;font-size:.92rem;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(.95)}
.btn.quiet{border-color:var(--line-2)}
.btn.danger{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.inp,.search{border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--panel);min-height:40px;padding:8px 12px;font-size:.95rem}
.inp:focus,.search:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
select.inp{padding-right:28px}
.field label,.field .q{font-weight:600;font-size:.9rem;color:var(--ink-2)}
.hint{color:var(--muted);font-size:.82rem}
.linkbtn{font-weight:500}

/* Filters: segmented chips */
.chips{gap:6px}
.chip{border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:.85rem;padding:5px 11px;color:var(--ink-2)}
.chip .ct{color:var(--muted);font-weight:500}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .ct{color:inherit;opacity:.7}
.chip.st-bad[aria-pressed="false"]{border-color:color-mix(in srgb,var(--bad) 45%,var(--line-2));color:var(--bad)}
.chip.st-warn[aria-pressed="false"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line-2));color:var(--warn)}
.filters{gap:12px;margin-bottom:8px}

/* Tables */
.tw{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel)}
table{background:transparent}
th{background:transparent;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.01em;border-bottom:1px solid var(--line);padding:11px 12px}
td{border-bottom:1px solid var(--line);padding:12px}
tbody tr:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
td b{font-weight:600}
.menu-t td,.menu-t th{padding:11px 12px}
.dash{color:var(--line-2)}
.grp-h{margin:28px 0 10px;align-items:baseline}
.grp-h h2{font-size:1.05rem}
.grp-h .mini{color:var(--muted);font-weight:500}
.mini{color:var(--muted)}
.order-name{font-family:var(--font);font-size:.78rem;letter-spacing:.02em;color:var(--muted);opacity:1}

/* Status tags: small dot + word */
.pill{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:0;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.pill.good{color:var(--good)} .pill.good::before{background:var(--good)}
.pill.warn{color:var(--warn)} .pill.warn::before{background:var(--warn)}
.pill.bad{color:var(--bad)} .pill.bad::before{background:var(--bad)}
.pill.brand{color:var(--ink)} .pill.brand::before{background:var(--brand)}
.flag{border-radius:6px;font-weight:600;font-size:.74rem}

/* Food cost bar: the one signature detail */
.fc{display:inline-grid;grid-template-columns:auto;justify-items:end;gap:4px;min-width:64px}
.fcbar{position:relative;width:64px;height:4px;border-radius:2px;background:var(--line)}
.fcbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--good)}
.fcbar.warn i{background:var(--warn)} .fcbar.bad i{background:var(--bad)}
.fcbar b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}

/* Insight cards (coach) */
.insight{border:1px solid var(--line);border-radius:var(--r-panel);grid-template-columns:4px 1fr auto}
.insight .tag{font-size:.78rem;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)}
.insight h3{font-size:1.02rem;margin:3px 0 4px}
.insight p{color:var(--ink-2)}
.insight .imp b{font-family:var(--brand-font);font-size:1.35rem}

/* Messages, setup, bulk */
.msg{border-radius:var(--r-ctl);font-weight:500;font-size:.92rem}
.setup{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-panel)}
.setup li{background:transparent;border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px}
.setup li .dot{border:1.5px solid var(--line-2);background:var(--panel)}
.setup li b{font-weight:600}
.bulk{background:var(--ink);color:var(--bg);border-radius:var(--r-ctl);padding:8px 12px}
.bulk select{border-radius:7px}
.bulk .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);min-height:34px}

/* Dialogs */
dialog::backdrop{background:var(--shade);backdrop-filter:blur(2px)}
.sheet{border-radius:16px;box-shadow:0 24px 60px rgba(16,22,19,.28)}
.sheet-h{padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.15rem}
.sheet-b{padding:18px 20px}
.sheet-f{padding:12px 20px;border-top:1px solid var(--line);background:var(--field)}
.x,.close{background:transparent;border:1px solid var(--line);border-radius:var(--r-ctl);width:36px;height:36px;font-size:1.2rem}
.cost{border:1px solid var(--line);border-radius:var(--r-ctl)}
.cost b{font-family:var(--brand-font)}
.toast{border-radius:var(--r-ctl);font-weight:500;background:var(--ink);color:var(--bg)}

/* Sign-in */
.gate{background:var(--side)}
.gate .card{border:0;border-radius:18px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate h1{font-size:1.6rem}
.tabs2 button{border:1px solid var(--line-2);background:var(--panel);font-weight:600;border-radius:var(--r-ctl)}
.tabs2 button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kit-drop{border:1.5px dashed var(--line-2);border-radius:var(--r-panel)}

@media (max-width:900px){
  aside{box-shadow:none;border-bottom:1px solid var(--side-line)}
  nav button[aria-current="page"]::before{display:none}
  nav button[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
  nav button .ic{width:16px;height:16px}
  main{padding:18px 14px 70px}
  h1{font-size:1.45rem}
}
@media (max-width:700px){
  .tw tbody tr{border:1px solid var(--line);border-radius:var(--r-panel);padding:12px 14px}
  .tw tbody td{padding:3px 0}
  .fc{justify-items:end}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.pill,.pill.good,.pill.warn,.pill.bad,.pill.brand{background:transparent;border:0;padding:0}
.mini{font-weight:400}
.grp-h .mini,.setup li span.mini{font-weight:400}
.setup .skip{font-size:.82rem;margin-left:10px}

/* ---------- Second design pass ---------- */
main{padding-top:34px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.phead h1{margin:0 0 4px}
.phead .lead{margin:0}
.phead > div:first-child{min-width:0;flex:1 1 320px}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 10px}
.sect-h h2{margin:0;font-size:1.05rem}
.sect-h .mini{color:var(--muted)}

/* Key numbers: one strip, not four boxes */
.kstrip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel);overflow:hidden}
.kstrip > div{padding:18px 22px 16px;border-left:1px solid var(--line);min-width:0}
.kstrip > div:first-child{border-left:0}
.kstrip .n{font-family:var(--brand-font);font-size:2.15rem;font-weight:700;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.kstrip .n.bad{color:var(--bad)} .kstrip .n.warn{color:var(--warn)}
.kstrip .l{color:var(--muted);font-size:.84rem;margin-top:6px}
.kstrip .clickable{cursor:pointer;transition:background .12s}
.kstrip .clickable:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
@media (max-width:760px){.kstrip{grid-template-columns:1fr 1fr}.kstrip > div:nth-child(3){border-left:0}.kstrip > div:nth-child(n+3){border-top:1px solid var(--line)}.kstrip .n{font-size:1.7rem}}

/* Suggestions: one list with rules between rows */
.inslist{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel);overflow:hidden}
.inslist .insight{border:0;border-radius:0;margin:0;border-top:1px solid var(--line);background:transparent;box-shadow:none;padding:16px 20px 16px 18px}
.inslist .insight:first-child{border-top:0}
.insight .bar{border-radius:3px;width:3px}
.insight .acts{margin-top:10px;gap:8px;align-items:center}
.insight .acts .btn{min-height:34px;padding:6px 12px;font-size:.86rem}
.insight .dismiss{margin-left:auto;color:var(--muted);font-size:.84rem;text-decoration:none}
.insight .dismiss:hover{color:var(--ink);text-decoration:underline}
.insight .imp{text-align:right}
.insight .imp span{color:var(--muted);font-size:.8rem}

/* Setup checklist: progress first, steps underneath */
.setup{padding:18px 20px}
.setup-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.setup-h h3{margin:0 0 8px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:420px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .4s}
.setup.collapsed{padding:14px 20px}
.setup{margin-bottom:20px}
.setup ol{margin-top:16px}
.ix{width:34px;height:34px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--panel);color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;display:inline-grid;place-items:center}
.ix:hover{color:var(--ink);border-color:var(--ink-2)}
.banner{margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:14px 18px}
.banner > div:first-child{flex:1 1 260px}

/* Sidebar account */
.userbox{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ubox{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;letter-spacing:.02em}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-size:.84rem;color:var(--side-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:.76rem;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.signout{background:transparent;border:1px solid var(--side-line);color:var(--side-muted);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.signout:hover{color:#fff;border-color:var(--side-muted)}
aside{display:flex;flex-direction:column}

/* Small refinements */
.tw thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.filters .row .btn{white-space:nowrap}
.card.empty{color:var(--muted);text-align:center;padding:28px}
td .mini{margin-top:2px}
@media (max-width:900px){.userbox{display:none}.phead{padding-bottom:14px;margin-bottom:16px}}
.inslist .insight{position:relative;grid-template-columns:1fr minmax(120px,auto);gap:16px;padding:14px 20px 14px 22px}
.inslist .insight .bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0}
.inslist .insight h3{margin:2px 0 3px}
.inslist .insight p{margin:0}
.inslist .insight .acts{margin-top:10px}
.inslist .insight .imp{min-width:120px;padding-top:2px}
@media (max-width:640px){
  .inslist .insight{display:flex;flex-direction:column;gap:4px;padding:14px 16px 14px 18px}
  .inslist .insight .imp{order:-1;display:flex;align-items:baseline;gap:8px;text-align:left;min-width:0;padding:0}
  .inslist .insight .imp b{font-size:1.15rem}
  .inslist .insight .acts{flex-wrap:wrap}
}
.sheet.wide{width:min(1040px,calc(100% - 24px))}
@media (max-width:700px){.sheet.wide{width:100%}}

/* Menu engineering classes */
.cls{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.84rem;white-space:nowrap}
.cls-ic{display:inline-grid;place-items:center;line-height:0}
.cls.star,.cls-ic.star{color:#1F7A4D}
.cls.plow,.cls-ic.plow{color:#A86A00}
.cls.puzzle,.cls-ic.puzzle{color:#2E64B5}
.cls.dog,.cls-ic.dog{color:#B4261E}
.cls > span:last-child{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cls.star,:root:not([data-theme="light"]) .cls-ic.star{color:#6FC79A}:root:not([data-theme="light"]) .cls.plow,:root:not([data-theme="light"]) .cls-ic.plow{color:#E3B75A}:root:not([data-theme="light"]) .cls.puzzle,:root:not([data-theme="light"]) .cls-ic.puzzle{color:#7FA8E8}:root:not([data-theme="light"]) .cls.dog,:root:not([data-theme="light"]) .cls-ic.dog{color:#F08A80}}
.cls-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 6px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--panel)}
.cls-legend .cls{font-size:.82rem}
.cls-legend .cls b{color:var(--ink);font-weight:600}
.cls-legend .cls .mini{color:var(--muted);font-weight:400}
.cls-tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel);overflow:hidden}
.cls-tile{padding:16px 18px;border-left:1px solid var(--line)}
.cls-tile:first-child{border-left:0}
.cls-tile .top{display:flex;align-items:center;gap:8px}
.cls-tile .top b{font-family:var(--brand-font);font-size:1.02rem;color:var(--ink)}
.cls-tile .top .n{margin-left:auto;font-family:var(--brand-font);font-weight:700;font-size:1.6rem;color:var(--ink)}
.cls-tile .say{font-weight:600;font-size:.86rem;margin-top:8px;color:var(--ink-2)}
.cls-tile .act{font-size:.82rem;color:var(--muted);margin-top:2px}
@media (max-width:820px){.cls-tiles{grid-template-columns:1fr 1fr}.cls-tile:nth-child(3){border-left:0}.cls-tile:nth-child(n+3){border-top:1px solid var(--line)}}

/* Dark theme tokens when chosen by hand */
:root[data-theme="dark"]{
  --bg:#101513; --panel:#171E1B; --ink:#E7ECE9; --ink-2:#C5CEC9; --muted:#8E9A94; --line:#26302C; --line-2:#36423D; --field:#1C2421;
  --good:#6FC79A; --good-soft:#18291F; --warn:#E3B75A; --warn-soft:#2B2414; --bad:#F08A80; --bad-soft:#2E1917;
  --side:#0C100E; --side-ink:#E6ECE9; --side-muted:#7D8A84; --side-line:#1F2824; --shade:rgba(0,0,0,.6);
}
:root[data-theme="dark"] .cls.star,:root[data-theme="dark"] .cls-ic.star{color:#6FC79A}
:root[data-theme="dark"] .cls.plow,:root[data-theme="dark"] .cls-ic.plow{color:#E3B75A}
:root[data-theme="dark"] .cls.puzzle,:root[data-theme="dark"] .cls-ic.puzzle{color:#7FA8E8}
:root[data-theme="dark"] .cls.dog,:root[data-theme="dark"] .cls-ic.dog{color:#F08A80}
:root[data-theme="dark"] .acct option{color:#18211D}

/* Quick search */
.qsearch{display:flex;align-items:center;gap:8px;width:100%;background:#ffffff0a;border:1px solid var(--side-line);color:var(--side-muted);border-radius:var(--r-ctl);padding:8px 10px;font-size:.88rem;cursor:pointer;text-align:left}
.qsearch:hover{color:var(--side-ink);border-color:var(--side-muted)}
.qsearch span{flex:1}
kbd{font-family:var(--font);font-size:.7rem;border:1px solid currentColor;border-radius:5px;padding:1px 5px;opacity:.7}
.cmdk{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--shade);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmdk[hidden]{display:none}
.cmdk-panel{width:min(620px,100%);background:var(--panel);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.cmdk-in input{flex:1;border:0;outline:0;background:transparent;font-size:1.05rem;color:var(--ink)}
.cmdk-list{max-height:min(420px,60vh);overflow:auto;padding:6px}
.cmdk-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
.cmdk-row.on{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.cmdk-row .k{font-size:.74rem;color:var(--muted);font-weight:600}
.cmdk-row .t{display:flex;flex-direction:column;min-width:0}
.cmdk-row .t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =====================================================================
   "The pass" design: diner back-of-house materials.
   Jadeite (diner mugs) for action, mustard and ketchup for watch/fix,
   grease-pencil charcoal for ink, stainless for the rail, guest-check
   green paper for the page. Big Shoulders Display (signage) + Atkinson
   Hyperlegible (readable in a kitchen).
   ===================================================================== */
:root{
  --jade:#1F6F5C; --jade-pale:#D3E9DF; --mustard:#D99A1E; --ketchup:#B8352A; --steel:#C9CFD1; --char:#24221F;
  --bg:#F3F7F2; --panel:#FFFFFF; --ink:#24221F; --ink-2:#4A4741; --muted:#66655D; --line:#DCE4DA; --line-2:#C5CFC3; --field:#F8FAF7;
  --good:#1F6F5C; --good-soft:#D3E9DF; --warn:#9A6A0B; --warn-soft:#F6E6C0; --bad:#B8352A; --bad-soft:#F7DCD7;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-panel:14px; --r-ctl:10px;
  --paper:#FBFDF9; --paper-rule:rgba(31,111,92,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18201C; --panel:#202924; --ink:#ECEFE9; --ink-2:#C9CFC8; --muted:#A3ACA4; --line:#2F3A33; --line-2:#3E4B43; --field:#1C241F;
    --good:#7CC7A9; --good-soft:#1F3A30; --warn:#E9B64E; --warn-soft:#3A3120; --bad:#F08A7E; --bad-soft:#3E211D;
    --paper:#2A332D; --paper-rule:rgba(124,199,169,.10); --jade-pale:#1F3A30;
  }
}
:root[data-theme="dark"]{
  --bg:#18201C; --panel:#202924; --ink:#ECEFE9; --ink-2:#C9CFC8; --muted:#A3ACA4; --line:#2F3A33; --line-2:#3E4B43; --field:#1C241F;
  --good:#7CC7A9; --good-soft:#1F3A30; --warn:#E9B64E; --warn-soft:#3A3120; --bad:#F08A7E; --bad-soft:#3E211D;
  --paper:#2A332D; --paper-rule:rgba(124,199,169,.10); --jade-pale:#1F3A30;
}
body{font-family:var(--font);font-size:16.5px;line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3,.brandbox b{font-family:var(--brand-font);letter-spacing:.005em}
h1{font-weight:800;font-size:clamp(2.1rem,4.2vw,2.9rem);line-height:1}
h2{font-weight:800;font-size:1.55rem;line-height:1.1}
h3{font-weight:700;font-size:1.2rem;line-height:1.15}
.lead{font-size:1.02rem;color:var(--ink-2)}

/* Sidebar: grease-pencil charcoal, jadeite for where you are */
aside{background:var(--char)}
aside .brandbox b{font-size:1.45rem;font-weight:800;color:#fff}
nav button[aria-current="page"]{background:var(--jade);color:#fff}
nav button[aria-current="page"] .ic{color:#fff}
#nav button:not([aria-current="page"]):hover{background:rgba(255,255,255,.07)}

/* Controls */
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(.92)}
.btn.quiet{background:var(--panel);border-color:var(--line-2)}
.btn:focus-visible,.bb:focus-visible,.chip:focus-visible,.tk button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--char);border-color:var(--char);color:#fff}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}

/* Panels: flat paper with a stacked edge, not floating cards */
.card,.kstrip,.mm,.tw,.feed-card{border-radius:var(--r-panel);border:1px solid var(--line);box-shadow:0 2px 0 var(--line-2)}
.kstrip > div b,.kstrip .n{font-family:var(--brand-font);font-weight:800;font-size:2.5rem;line-height:1;letter-spacing:.01em}
.cost b{font-family:var(--brand-font);font-weight:800;font-size:1.55rem}

/* Big buttons: jadeite wells */
.bb{border-radius:16px;border:1px solid var(--line);box-shadow:0 2px 0 var(--line-2)}
.bb-ic{background:var(--jade-pale);color:var(--jade)}
.bb-t b{font-family:var(--brand-font);font-weight:800;font-size:1.3rem;letter-spacing:.01em}
.bb.primary{background:var(--jade);border-color:var(--jade);box-shadow:0 2px 0 #174F42}
.bb-badge{background:var(--ketchup)}
.bb-sec h2{font-family:var(--font);font-size:.9rem;font-weight:700;color:var(--muted);letter-spacing:0}

/* Kitchen book: index-card rule under each dish */
.kb-card{border-radius:12px;box-shadow:0 2px 0 var(--line-2)}
.kb-body{border-top:2px solid color-mix(in srgb,var(--ketchup) 55%,transparent);background:linear-gradient(var(--paper),var(--paper))}
.kb-body b{font-family:var(--brand-font);font-weight:800;font-size:1.2rem}

/* ---------- The pass: tickets on a stainless rail ---------- */
.pass{position:relative;margin:4px 0 30px;padding-top:12px}
.pass-rail{position:absolute;left:-6px;right:-6px;top:6px;height:14px;border-radius:7px;
  background:linear-gradient(180deg,#F2F4F4 0%,#C9CFD1 45%,#9EA6A9 55%,#D7DCDE 100%);box-shadow:0 2px 3px rgba(36,34,31,.18) inset,0 1px 0 rgba(255,255,255,.6)}
.tickets{list-style:none;margin:0;padding:6px 4px 14px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.tk{position:relative;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:22px 16px 14px;background:var(--paper);color:var(--ink);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--paper-rule) 27px 28px);
  border:1px solid var(--line-2);border-top:none;border-radius:0 0 6px 6px;box-shadow:0 6px 14px rgba(36,34,31,.10),0 1px 0 var(--line-2);
  transform:rotate(calc((var(--i) - 1) * .35deg));transform-origin:50% 0;
  -webkit-mask:radial-gradient(circle 5px at 8px 0,transparent 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 5px at 8px 0,transparent 98%,#000) 0 0/16px 100% repeat-x}
.tk:nth-child(odd){transform:rotate(calc(var(--i) * -.3deg))}
.tk-clip{position:absolute;top:-4px;left:50%;width:46px;height:16px;margin-left:-23px;border-radius:3px;background:linear-gradient(180deg,#E6EAEB,#A9B1B4);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px dashed var(--line-2)}
.tk-no{font-family:var(--brand-font);font-weight:900;font-size:1.6rem;line-height:1;color:var(--ink)}
.tk-tag{font-size:.82rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.tk.bad .tk-tag{background:var(--bad-soft);color:var(--bad)}
.tk.good .tk-tag,.tk.info .tk-tag{background:var(--good-soft);color:var(--good)}
.tk h3{font-size:1.25rem;margin:2px 0 0}
.tk p{margin:0;color:var(--ink-2);font-size:.95rem;line-height:1.45}
.tk-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:8px;border-top:2px solid var(--ink)}
.tk-total span{font-size:.82rem;color:var(--muted);font-weight:600}
.tk-total b{font-family:var(--brand-font);font-weight:900;font-size:2.1rem;line-height:1;color:var(--ink)}
.tk-total.neg b{color:var(--bad)}
.tk .acts{flex-wrap:wrap;gap:6px}
.tk .acts .btn{min-height:40px;padding:8px 12px;font-size:.88rem}
.tk .dismiss{margin-left:auto}
/* One moment of motion: tickets drop onto the rail the first time Home opens */
@keyframes tkDrop{from{transform:translateY(-26px) rotate(0);opacity:0}to{opacity:1}}
.pass.drop .tk{animation:tkDrop .45s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i) * 70ms)}
@media (prefers-reduced-motion: reduce){.pass.drop .tk{animation:none}.tk,.tk:nth-child(odd){transform:none}}
@media (max-width:700px){
  .tickets{grid-auto-columns:84%;gap:12px;padding-left:2px}
  .pass-rail{left:-12px;right:-12px}
  h1{font-size:2.2rem}
  .kstrip > div b,.kstrip .n{font-size:2.1rem}
}

/* =====================================================================
   Calmer pass: signage type only for the page title, big numbers and
   ticket totals; everything else in the readable face. Flat surfaces.
   ===================================================================== */
h2,h3,.tk h3,.kb-body b,.bb-t b,.feed-h h3{font-family:var(--font);letter-spacing:0}
h1{font-size:clamp(2rem,3.4vw,2.55rem);font-weight:800;margin-bottom:4px}
h2{font-size:1.15rem;font-weight:700;line-height:1.25}
h3{font-size:1.02rem;font-weight:700;line-height:1.3}
.lead{margin-top:2px;color:var(--muted);font-size:1rem}
.phead{margin-bottom:18px}
.card,.kstrip,.mm,.tw,.feed-card,.kb-card,.bb{box-shadow:none}
.card,.kstrip,.mm,.feed-card{border-color:var(--line)}
.sect-h{margin:30px 0 10px;align-items:baseline}
.sect-h h2{margin:0}
.kstrip{margin-top:16px}
.kstrip > div{padding:16px 18px}
.kstrip > div b,.kstrip .n{font-size:2.15rem}
.kstrip .l{color:var(--muted);font-size:.9rem}
.cost b{font-family:var(--font);font-weight:700;font-size:1.25rem}
.kb-body{border-top-width:2px}
.kb-body b{font-size:1rem;font-weight:700}
.tk h3{font-size:1.05rem}

/* Sidebar: navigation, not a second menu */
aside .brandbox b{font-size:1.3rem}
#nav button{font-size:.95rem;padding:9px 12px;min-height:40px}
#nav button .ic svg{width:18px;height:18px}

/* Quick actions: one slim row */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0 4px}
.qa-btn{position:relative;display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer}
.qa-btn:hover{border-color:var(--ink-2)}
.qa-btn:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.qa-ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--jade-pale);color:var(--jade)}
.qa-ic .ic,.qa-ic svg{width:18px!important;height:18px!important}
.qa-btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.qa-btn.primary .qa-ic{background:color-mix(in srgb,var(--on-brand) 18%,transparent);color:var(--on-brand)}
.qa-badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--ketchup);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.bb.primary,.bb.primary .bb-t b,.bb.primary .bb-t span{color:var(--on-brand)}
@media (max-width:900px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){
  .qa{gap:8px;margin-top:14px}
  .qa-btn{min-height:58px;font-size:.95rem;padding:10px 12px}
  h1{font-size:2rem}
  .kstrip > div b,.kstrip .n{font-size:1.9rem}
}

.pk-list{display:grid;gap:6px;margin:10px 0}
.pk-row{display:grid;grid-template-columns:auto 56px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.pk-row img,.pk-noimg{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--field);display:block}
.pk-t{display:flex;flex-direction:column;min-width:0}
.pk-n{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.pk-ings summary{cursor:pointer;font-weight:600;padding:6px 0}
.kb-hero{object-fit:contain;max-height:440px;background:var(--field)}
/* Tickets hang straight */
.tk,.tk:nth-child(odd){transform:none}
@keyframes tkDrop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
/* Kitchen book photos: show the whole picture in a square, with a soft blurred fill behind tall or wide shots */
.kb-imgwrap{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--field);isolation:isolate}
.kb-imgwrap::before{content:"";position:absolute;top:-24px;right:-24px;bottom:-24px;left:-24px;background:var(--bg) center/cover no-repeat;filter:blur(20px) saturate(1.1) brightness(.88);z-index:-1}
.kb-card .kb-imgwrap img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;aspect-ratio:auto;object-fit:contain;display:block;background:transparent}
.kb-card.tall .kb-imgwrap,.kb-card.tall .kb-ph{aspect-ratio:3/4}
/* Same padding trick for older iPad Safari: the frame's height comes from its width. */
.kb-card .kb-imgwrap{aspect-ratio:auto;height:0;padding-top:100%}
.kb-card.tall .kb-imgwrap{padding-top:133.33%}
.kb-card .kb-imgwrap .kb-aitag{position:absolute}
.kb-card .kb-ph{aspect-ratio:1/1}
.kb-aitag{z-index:1}

/* ---------- Home for a bar manager ---------- */
.ny-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.ny{display:inline-flex;align-items:baseline;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;min-height:46px}
.ny b{font-family:var(--brand-font);font-size:1.5rem;font-weight:800;line-height:1}
.ny.bad{background:var(--bad-soft);border-color:transparent} .ny.bad b{color:var(--bad)}
.ny.warn{background:var(--warn-soft);border-color:transparent} .ny.warn b{color:var(--warn)}
.ny.ok{cursor:default;background:var(--good-soft);border-color:transparent;color:var(--good)} .ny.ok b{font-family:var(--font);font-size:1rem}
.ny:not(.ok):hover{filter:brightness(.97)}
.cats{display:grid;gap:22px;margin:22px 0 6px}
.cat-sec h2{margin:0 0 10px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cat{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line-2)}
.cat.good::before{background:var(--jade)} .cat.warn::before{background:var(--mustard)} .cat.bad::before{background:var(--ketchup)}
.cat-main{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px 16px 10px 20px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:104px}
.cat-main:hover{background:var(--field)}
.cat-main:focus-visible{outline:3px solid var(--mustard);outline-offset:-3px}
.cat-name{font-family:var(--brand-font);font-weight:800;font-size:1.65rem;line-height:1.05}
.cat-count{font-weight:600;color:var(--ink-2);font-size:.92rem}
.cat-pct{font-size:.86rem;color:var(--muted)} .cat-pct b{color:var(--ink)}
.cat.bad .cat-pct b{color:var(--bad)} .cat.warn .cat-pct b{color:var(--warn)}
.cat-foot{display:flex;justify-content:space-between;align-items:center;padding:0 14px 10px 20px;min-height:36px}
.cat-fix{font-size:.8rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 9px}
@media (max-width:700px){
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cat-main{min-height:96px;padding:14px 12px 8px 16px}
  .cat-name{font-size:1.4rem}
  .cat-foot{padding:0 10px 8px 16px}
  .ny{flex:1 1 calc(50% - 8px)}
}
.ny{align-items:center;text-align:left}
.ny span{line-height:1.25}
@media (max-width:700px){.ny{padding:10px 12px;gap:10px}.ny b{font-size:1.7rem}}

/* ---------- Test kitchen ---------- */
.lab-ask{display:grid;gap:12px}
.lab-in{font-size:1.05rem;min-height:84px;resize:vertical}
.lab-ideas{flex-wrap:wrap}
.lab-opts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:end}
.lab-go{min-height:46px;padding:0 26px}
.lab-wait{display:flex;align-items:center;gap:14px} .lab-wait p{margin:0;color:var(--muted)}
.lab-result{display:grid;gap:12px;margin-top:16px;border-left:4px solid var(--jade)}
.lab-head{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.lab-desc{margin:4px 0 0;color:var(--ink-2)}
.lab-price{display:grid;grid-template-columns:repeat(4,minmax(96px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lab-price > div{padding:10px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.lab-price > div:first-child{border-left:0}
.lab-price span{font-size:.78rem;color:var(--muted);font-weight:600}
.lab-price b{font-family:var(--brand-font);font-weight:800;font-size:1.6rem;line-height:1.1}
.lab-price .inp{min-height:38px;font-weight:700;font-size:1.05rem;padding:4px 8px;max-width:110px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.lab-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.lab-sec{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.lab-sec .inp{min-height:40px;width:170px}
.lab-saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lab-idea{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:4px 12px 4px 4px}
.lab-idea-main{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:transparent;font:inherit;color:var(--ink);text-align:left;padding:10px;cursor:pointer;border-radius:10px}
.lab-idea-main:hover{background:var(--field)}
@media (max-width:700px){
  .lab-opts{grid-template-columns:1fr 1fr} .lab-go{grid-column:1/-1}
  .lab-price{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .lab-price > div:nth-child(3){border-left:0} .lab-price > div:nth-child(n+3){border-top:1px solid var(--line)}
  .lab-cols{grid-template-columns:1fr}
  .lab-actions .row{width:100%} .lab-sec{flex:1} .lab-sec .inp{width:100%}
}
.lab-notes{white-space:pre-line}
.lab-photo{flex:0 0 220px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lab-photo .kb-imgwrap{width:220px;border-radius:12px}
.lab-photo .kb-imgwrap img{width:100%;height:100%;object-fit:contain}
.lab-photo-wait{width:220px;aspect-ratio:1/1;border-radius:12px;border:1px dashed var(--line-2);background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}
.lab-idea-img{width:48px;height:48px;border-radius:8px;object-fit:cover;margin-left:6px}
@media (max-width:700px){.lab-photo{flex-basis:100%;align-items:stretch}.lab-photo .kb-imgwrap,.lab-photo-wait{width:100%}}

.lab-edit{display:grid;gap:10px;border:1px dashed var(--line-2);border-radius:12px;padding:14px;background:var(--field)}
.lab-eg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lab-erows{display:grid;gap:8px}
.lab-erow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.lab-eline{display:grid;grid-template-columns:minmax(0,2fr) 90px 96px minmax(0,2fr) 44px;gap:8px;align-items:center}
.lab-eline .inp,.lab-eest .inp{min-height:40px}
.lab-x{min-height:40px;padding:0;font-size:1.2rem}
.lab-eest{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 110px minmax(0,1.4fr);gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.lab-eest label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.lab-eest .row{gap:6px;flex-wrap:nowrap} .lab-eest .row .inp:first-child{width:80px}
.lab-revise{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.lab-revise .row{flex-wrap:nowrap} .lab-revise .inp{flex:1}
@media (max-width:700px){
  .lab-eg{grid-template-columns:1fr 1fr}
  .lab-eline{grid-template-columns:1fr 80px 90px;}
  .lab-eline > select:nth-of-type(2){grid-column:1/3} .lab-x{grid-column:3}
  .lab-eest{grid-template-columns:1fr 1fr}
  .lab-revise .row{flex-wrap:wrap} .lab-revise .btn{width:100%}
}

/* ---------- Choice groups ---------- */
.opts{display:grid;gap:12px}
.opt-group{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.opt-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.opt-up{width:92px;min-height:36px;text-align:right}
.line.in-choice{border-left:3px solid var(--mustard);padding-left:6px}
.line-choice{display:grid;grid-template-columns:auto minmax(0,200px) 1fr;gap:8px;align-items:center;margin:-2px 0 8px 10px}
.line-choice .inp{min-height:36px}
.lab-echoice{display:grid;grid-template-columns:minmax(0,2fr) 140px;gap:8px;margin-top:8px}
.lab-echoice label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.lab-echoice .inp{min-height:38px}
@media (max-width:700px){.line-choice{grid-template-columns:1fr;margin-left:0}.lab-echoice{grid-template-columns:1fr 1fr}}
.lab-from{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl-list{margin:6px 0 14px;padding-left:18px;display:grid;gap:6px}
.tl-link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.tl-link code{flex:1 1 280px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:.82rem;word-break:break-all}

const fillIn = (node, ...k) => node.replaceChildren(...k.flat().filter(x => x != null && x !== false));

function save(){
  if (!ACCT) return;
  Sync.dirty = true;
  clearTimeout(Sync.timer); Sync.timer = setTimeout(pushState, 700);
}
async function pushState(){
  if (Sync.saving){ Sync.again = true; return; }
  Sync.saving = true;
  const page = ST.page; const { data, error } = await sb.rpc("save_state", { p_account: ACCT.id, p_state: Object.assign({}, ST, { page: "home" }), p_base_version: VERSION });
  ST.page = page; Sync.saving = false;
  if (!error){ VERSION = data; if (Sync.again){ Sync.again = false; pushState(); } else Sync.dirty = false; bookSyncSoon(); return; }
  if (error.code === "40001"){ await reloadState("Someone else on your team just saved. Showing their latest; redo your last change."); return; }
  if (error.code === "42501" || error.code === "28000"){ toast("You no longer have access to this kitchen."); await afterLogin(); return; }
  toast("Not saved yet. Retrying…"); Sync.timer = setTimeout(pushState, 5000);
}
async function reloadState(msg){
  const { data, error } = await sb.rpc("load_state", { p_account: ACCT.id });
  if (error || !data || !data[0]) { toast(plainErr(error)); return; }
  const page = ST ? ST.page : "home";
  ST = normalizeState(data[0].state); ST.page = page; VERSION = data[0].version; ACCT.role = data[0].role; Sync.dirty = false;
  if (!dlg.open) render();
  if (msg) toast(msg);
}
function normalizeState(st){
  st = st && st.restaurants ? st : freshEmpty(ACCT ? ACCT.name : "");
  st.brand = Object.assign(DEFAULT_BRAND(), st.brand || {});
  if (!st.restaurants[st.current]) st.current = Object.keys(st.restaurants)[0];
  if (!st.current){ const r = emptyRestaurant(ACCT ? ACCT.name : "Main kitchen"); st.restaurants[r.id] = r; st.current = r.id; }
  st.page = st.page || "home";
  return st;
}
// Pick up teammates' changes every 30 seconds when you're not mid-edit.
setInterval(async () => {
  if (!ACCT || Sync.saving || Sync.dirty || document.hidden || dlg.open) return;
  const { data } = await sb.rpc("state_version", { p_account: ACCT.id });
  if (typeof data === "number" && data > VERSION) reloadState("Updated with your team's latest changes");
}, 30000);

const SUFFIX_CODES = /^(GR|MT|DY|FR|DS|SF|PR|BK|CN|PRD|DRY|FRZ)$/;

const NOUN_FIRST = /^(cheese|sauce|bean|beans|muffin|soup|bag|cup|glove|towel|placemat|toothpick|jam|creamer|base|pepper|entree|chip|chips|biscuit|fries|ketchup|shrimp)$/;
function autoTitle(name){
  const raw = String(name || "").trim(); if (!raw) return "";
  if (/[a-z]/.test(raw)) return raw;                                          // already written for people
  let toks = raw.replace(/\bCHIP POT\b/i, "CHIP POTATO").replace(/\bW\/(?!A\b)/gi, "WITH ").split(/\s+/).filter(Boolean);
  if (toks.length > 1 && SUFFIX_CODES.test(toks[toks.length - 1])) toks.pop();
  // Keep portion sizes like 2Z / .75Z (ounces) so similar items stay distinguishable; drop other pack and count codes.
  const sizeTok = toks.find(t => /^\d*\.?\d+Z$/i.test(t));
  const size = sizeTok ? (sizeTok.replace(/Z$/i, "").replace(/^\./, "0.")) + " oz" : "";
  toks = toks.filter(t => !/\d/.test(t) || /^w\/a$/i.test(t));
  let words2 = toks.map(t => { const k = t.toLowerCase(); return k in DIST_ABBR ? DIST_ABBR[k] : k; }).join(" ").split(/\s+/).filter(Boolean);
  if (!words2.length) return raw;
  if (words2.length >= 2 && NOUN_FIRST.test(words2[0])){
    const noun = words2.shift();
    if (noun === "entree") words2 = words2;                                  // "ENTREE CHIPPED BEEF CRMD" -> "Chipped Beef Creamed"
    else if (noun === "chip" && words2[0] === "potato"){ words2.shift(); words2 = ["potato", "chips"].concat(words2.length ? [","].concat(words2) : []); }
    else {

      const tail = []; ["mix", "roll", "packet", "pack"].forEach(w => { const i = words2.indexOf(w); if (i >= 0){ words2.splice(i, 1); tail.push(w); } });
      words2 = words2.concat([noun], tail);
    }
  }
  if (size) words2 = words2.concat([",", size]);
  const title = words2.join(" ").replace(/\s+,/g, ",").replace(/\b([a-z])/g, (m0, c) => c.toUpperCase()).replace(/\bWith\b/g, "with").replace(/\bBbq\b/g, "BBQ").replace(/\bMsg\b/g, "MSG").replace(/\bIqf\b/g, "IQF").replace(/\bOz\b/g, "oz");

function vendorRepairPlan(r){
  const docs = new Map((r.inbox || []).map(d => [d.id, d]));
  const renames = {};
  const note = nm => { const c = canonVendor(nm, r); if (nm && c !== nm) renames[nm] = c; };
  Object.values(r.supplies).forEach(su => note(su.supplier)); (r.inbox || []).forEach(d => note(d.supplier)); (r.vendors || []).forEach(v => note(v.name));
  const moves = [];
  Object.values(r.supplies).forEach(su => {
    if (!su.supplier || su.altOf || su.estimated) return;
    const foreign = (su.history || []).filter(h => { const d = h.doc && docs.get(h.doc); return d && d.supplier && !sameVendor(d.supplier, su.supplier, r); });
    if (!foreign.length) return;
    const keep = (su.history || []).filter(h => !foreign.includes(h)).sort((p, q) => hkey(p).localeCompare(hkey(q)));

  const rawMinX = Math.min(...pts.map(p => p.x));

    xMax = Math.ceil((rawMaxX + (filtered ? st * 0.2 : rawMaxX * 0.05)) / st) * st; xTicks = []; for (let v = xMin; v <= xMax + 1e-9; v += st) xTicks.push(v);
  }
  // Y: start near the lowest dish rather than always at $0, so the middle isn't squashed.
  const lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  const yStep = niceStep((hi - Math.min(0, lo)) * 1.08 || 1);
  const yMin = lo > yStep ? Math.floor((lo - yStep * 0.4) / yStep) * yStep : Math.min(0, Math.floor(lo / yStep) * yStep);
  const yMax = Math.ceil((hi + yStep * 0.12) / yStep) * yStep;
  const X = v => L + ((xs(v) - xs(xMin)) / (xs(xMax) - xs(xMin) || 1)) * (W - L - R2), Y = v => T + (1 - (v - yMin) / (yMax - yMin)) * (H - T - B);
  const popX = eng.popLine * eng.totalSold, cmY = eng.avgCM;
  const NS = "http://www.w3.org/2000/svg", mk = (tag, at, txt) => { const e2 = document.createElementNS(NS, tag); Object.entries(at || {}).forEach(([k, v]) => e2.setAttribute(k, v)); if (txt != null) e2.textContent = txt; return e2; };
  const svg = mk("svg", { viewBox:"0 0 " + W + " " + H, class:"mm-svg" + (phone ? " phone" : ""), role:"img", "aria-label":"Menu map: each dish by plates sold and profit per plate" });
  const qx = Math.max(L, Math.min(W - R2, X(popX))), qy = Math.max(T, Math.min(H - B, Y(cmY)));
  [["star", qx, T, W - R2 - qx, qy - T], ["puzzle", L, T, qx - L, qy - T], ["plow", qx, qy, W - R2 - qx, H - B - qy], ["dog", L, qy, qx - L, H - B - qy]].forEach(([c, x, y, w, h]) => { if (w > 0 && h > 0) svg.append(mk("rect", { x, y, width:w, height:h, class:"mm-q " + c })); });
  for (let v = yMin; v <= yMax + 1e-9; v += yStep){ const yy = Y(v); svg.append(mk("line", { x1:L, x2:W - R2, y1:yy, y2:yy, class:"mm-grid" })); svg.append(mk("text", { x:L - 8, y:yy + 4, class:"mm-tick", "text-anchor":"end" }, "$" + (Number.isInteger(v) ? v : v.toFixed(2)))); }
  let lastTickX = -99; xTicks.forEach(v => { const xx = X(v); if (xx - lastTickX < 34 && v !== xMax) return; lastTickX = xx; svg.append(mk("line", { x1:xx, x2:xx, y1:T, y2:H - B, class:"mm-grid v" })); svg.append(mk("text", { x:xx, y:H - B + 18, class:"mm-tick", "text-anchor":"middle" }, Math.round(v))); });
  if (qx > L && qx < W - R2) svg.append(mk("line", { x1:qx, x2:qx, y1:T, y2:H - B, class:"mm-div" }));
  if (qy > T && qy < H - B) svg.append(mk("line", { x1:L, x2:W - R2, y1:qy, y2:qy, class:"mm-div" }));
  svg.append(mk("text", { x:(L + W - R2) / 2, y:H - 8, class:"mm-axis", "text-anchor":"middle" }, "Plates sold per " + r.period + (spread && !phone ? " (spread-out scale)" : "") + " \u2192"));
  svg.append(mk("text", { x:16, y:(T + H - B) / 2, class:"mm-axis", "text-anchor":"middle", transform:"rotate(-90 16 " + ((T + H - B) / 2) + ")" }, "Profit per plate \u2192"));
  const corner = (cls, x, y, anchor) => { const g = mk("g", { class:"mm-corner " + CLASS_INFO[cls].c }); const ic = mk("svg", { x: anchor === "end" ? x - 16 : x, y: y - 12, width:14, height:14, viewBox:"0 0 24 24" }); ic.innerHTML = CLASS_INFO[cls].svg; g.append(ic, mk("text", { x: anchor === "end" ? x - 20 : x + 18, y, "text-anchor": anchor === "end" ? "end" : "start" }, cls + "s")); svg.append(g); };
  const inView = new Set(pts.map(p => p.cls));
  if (inView.has("Star")) corner("Star", W - R2 - 8, T + 18, "end"); if (inView.has("Puzzle")) corner("Puzzle", L + 8, T + 18, "start");
  if (inView.has("Plowhorse")) corner("Plowhorse", W - R2 - 8, H - B - 10, "end"); if (inView.has("Dog")) corner("Dog", L + 8, H - B - 10, "start");
  // Screen positions, nudging apart dishes that would sit on top of each other.
  const placed = [];
  pts.slice().sort((a, b) => b.x - a.x || b.y - a.y).forEach(p => {
    let px = X(p.x), py = Y(p.y), tries = 0;
    while (tries < 12 && placed.some(q => Math.hypot(q.px - px, q.py - py) < 11)){ const ang = tries * 2.4; px = X(p.x) + Math.cos(ang) * (6 + tries * 1.5); py = Y(p.y) + Math.sin(ang) * (6 + tries * 1.5); tries++; }
    p.px = px; p.py = py; placed.push(p);
  });
  // Labels: busiest and most extreme first; each takes the first spot (right, left, above, below) that's clear.
  const boxes = [], PAD = 7;
  const hits = b => boxes.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y) || b.x < L || b.x + b.w > W - R2 || b.y < T || b.y + b.h > H - B ||
    pts.some(q => q.px > b.x - PAD && q.px < b.x + b.w + PAD && q.py > b.y - PAD && q.py < b.y + b.h + PAD && !b.own.includes(q));
  const pri = pts.slice().sort((a, b) => (b.x / rawMaxX + Math.abs(b.y - cmY) / (hi - lo || 1)) - (a.x / rawMaxX + Math.abs(a.y - cmY) / (hi - lo || 1)));
  const labelFor = new Map();
  pri.forEach(p => {
    const maxC = phone ? 18 : 26, name = p.it.name.length > maxC ? p.it.name.slice(0, maxC - 1) + "\u2026" : p.it.name, w = name.length * CW + 6, h = phone ? 17 : 15;
    const spots = [[p.px + 11, p.py - 7, "start", p.px + 11, p.py + 4], [p.px - 11 - w, p.py - 7, "end", p.px - 11, p.py + 4], [p.px - w / 2, p.py - 24, "middle", p.px, p.py - 13], [p.px - w / 2, p.py + 10, "middle", p.px, p.py + 21]];
    for (const [bx, by, anchor, tx, ty] of spots){ const b = { x: bx, y: by, w, h, own: [p] }; if (!hits(b)){ boxes.push(b); labelFor.set(p, { anchor, tx, ty, name }); break; } }
  });
  pts.forEach(p => {
    const g = mk("g", { class:"mm-pt " + CLASS_INFO[p.cls].c, tabindex:"0", role:"button", "aria-label": p.it.name + ", " + p.cls + ", " + p.x + " sold, " + $$(p.y) + " profit per plate" });
    g.append(mk("title", null, p.it.name + "\n" + p.cls + ": " + CLASS_INFO[p.cls].say + "\n" + p.x + " sold per " + r.period + ", " + $$(p.y) + " profit per plate"));
    g.append(mk("circle", { cx:p.px, cy:p.py, r: phone ? (many > 40 ? 6 : 8) : many > 40 ? 5.5 : 7 }));
    const lab = labelFor.get(p); if (lab) g.append(mk("text", { x:lab.tx, y:lab.ty, "text-anchor":lab.anchor, class:"mm-label" }, lab.name));
    const open = () => openRecipe(p.it.id); g.addEventListener("click", open); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } });
    svg.append(g);
  });
  const unlabeled = pts.length - labelFor.size;
  head.querySelector(".mm-note").textContent = (filtered ? "Zoomed to " + [...MM_SHOW].map(k => k + "s").join(" and ") + ". " : (phone ? "Right sells more; higher earns more per plate. " : "Each dot is a dish. Further right sells more; higher up earns more per plate. Dashed lines mark your averages. ")) + (phone ? "Tap a dot to open its recipe." : "Click a dot to open its recipe." + (unlabeled ? " Hover a dot to see names that didn't fit (" + unlabeled + ")." : ""));
  holder.replaceChildren(head, chips, svg);

}
/* ================= Count-up on Home's key numbers ================= */
let countedOnce = false;
function countUp(root){
  if (countedOnce || matchMedia("(prefers-reduced-motion: reduce)").matches) return; countedOnce = true;
  root.querySelectorAll(".kstrip .n").forEach(nEl => {
    const txt = nEl.textContent, m0 = txt.match(/^([^\d-]*)(-?[\d,]+(?:\.\d+)?)(.*)$/); if (!m0) return;
    const target = parseFloat(m0[2].replace(/,/g, "")), dec = (m0[2].split(".")[1] || "").length, t0 = performance.now(), dur = 700;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e2 = 1 - Math.pow(1 - k, 3), v = target * e2;
      nEl.textContent = m0[1] + v.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m0[3]; if (k < 1) requestAnimationFrame(step); else nEl.textContent = txt; };
    requestAnimationFrame(step);
  });
}

/* ================= AI cost estimates ================= */
// For ingredients with no supply, and supplies with no price: AI suggests a typical distributor product,
// pack and case price. Everything is reviewed first and stays labeled as an estimate until a real price arrives.
async function openEstimates(){
  const r = R();
  const groups = unpricedGroups(r).map(g => ({ kind:"line", label:g.label, lines:g.lines, uses: g.items.size, use: (() => { const l = g.lines[0]; return (l.qty || 1) + " " + (l.unit || "each"); })() }));
  const noPrice = Object.values(r.supplies).filter(su => !(n(su.price) > 0) && usedBy(su.id).length).map(su => ({ kind:"supply", label: supName(su), su, uses: usedBy(su.id).length, use: su.unit }));
  const todo = groups.concat(noPrice).slice(0, 120);
  if (!todo.length){ toast("Nothing needs an estimate: every ingredient has a price"); return; }
  openDlg("Estimating costs", [el("div",{class:"spin"}), el("p",{style:"text-align:center", text:"Estimating typical prices for " + todo.length + (todo.length === 1 ? " ingredient" : " ingredients") + "\u2026"})], []);
  const out = []; let failed = 0, lastErr = null;
  const batches = []; for (let k = 0; k < todo.length; k += 10) batches.push(todo.slice(k, k + 10));
  const runBatch = async batch => {
      const d = await aiJSON("You estimate typical " + new Date().getFullYear() + " US foodservice distributor prices (Sysco, Gordon Food Service, US Foods; Midwest) for a small independent restaurant and bar. For each ingredient, pick the usual product a kitchen like this buys and give its case pack and case price. Units must be one of: " + UNIT_NAMES.join(", ") + ". Prefer the unit kind of how it's used (weight, volume or count). Return ONLY compact JSON: {\"items\":[{\"name\": ingredient exactly as given, \"product\": short product name, \"pack\": pack text like \"4/2.5 lb\", \"caseQty\": number of units in the case, \"unit\": unit, \"price\": typical case price in USD, \"low\": low end, \"high\": high end}]}. If you truly can't tell, omit the item.\nIngredients (name; how a recipe uses it):\n" +
        batch.map(t => t.label + "; " + t.use).join("\n"));
      (d.items || []).forEach(x => { const t = batch.find(b => b.label.toLowerCase() === String(x.name || "").trim().toLowerCase()); if (t && n(x.price) > 0 && n(x.caseQty) > 0 && UNITS[x.unit]) out.push(Object.assign({}, t, { product: String(x.product || t.label).slice(0, 60), pack: x.pack || "", caseQty: n(x.caseQty), unit: x.unit, price: Math.round(n(x.price) * 100) / 100, low: n(x.low), high: n(x.high), take: true })); });
  };
  // Three batches at a time; each failed batch gets one retry. Problems that won't fix themselves stop early.
  const fatal = e => e && (e.code === "unavailable" || e.code === "signin" || ["credit","key","permission","model"].includes(e.reason));
  for (let k = 0; k < batches.length; k += 3){
    const res = await Promise.allSettled(batches.slice(k, k + 3).map(b => runBatch(b).catch(async e => { if (fatal(e)) throw e; await new Promise(r2 => setTimeout(r2, 1500)); return runBatch(b); })));
    res.forEach((x, i) => { if (x.status === "rejected"){ failed += batches[k + i].length; lastErr = x.reason; } });
    if (lastErr && fatal(lastErr)) break;
  }
  if (!out.length){ openDlg("Estimate costs", [el("div",{class:"msg bad", text: aiProblem(lastErr) || (lastErr ? "Estimates aren't available right now (error " + (lastErr.status || "unknown") + "). Try again in a minute." : "AI couldn't estimate these. Link them to supplies, or add the supplies by hand.")})], []); return; }
  const tb = el("tbody"), addBtn = el("button",{class:"btn primary"});
  const paint = () => { const k = out.filter(x => x.take).length; addBtn.textContent = "Use " + k + (k === 1 ? " estimate" : " estimates"); addBtn.disabled = !k; };
  out.forEach(x => {
    const cb = el("input",{type:"checkbox", "aria-label":"Use estimate for " + x.label}); cb.checked = true; cb.onchange = () => { x.take = cb.checked; paint(); };
    const pr = el("input",{class:"inp", type:"number", step:"0.01", min:"0", style:"min-height:36px;width:100px", "aria-label":"Case price for " + x.label}); pr.value = x.price.toFixed(2);
    const per = el("span",{class:"mini"});
    const paintPer = () => { per.textContent = "$" + (x.price / x.caseQty).toFixed(3) + " / " + x.unit; };
    pr.oninput = () => { x.price = n(pr.value) || 0; paintPer(); };
    paintPer();
    tb.append(el("tr",{style:"cursor:default"}, el("td",null, cb),
      el("td",{style:"white-space:normal"}, el("b",{text:x.label}), el("div",{class:"mini", text: x.kind === "supply" ? "Supply with no price" : "Used in " + x.uses + (x.uses === 1 ? " recipe" : " recipes")})),
      el("td",{style:"white-space:normal"}, x.product, el("div",{class:"mini", text: [x.pack, x.caseQty + " " + x.unit].filter(Boolean).join(", ")})),
      el("td",{class:"num"}, pr, x.low && x.high ? el("div",{class:"mini", text: "typical $" + x.low.toFixed(0) + "\u2013$" + x.high.toFixed(0)}) : null),
      el("td",{class:"num"}, per)));
  });
  addBtn.onclick = () => {
    let added = 0, priced = 0;
    out.filter(x => x.take && x.price > 0).forEach(x => {
      if (x.kind === "supply"){
        Object.assign(x.su, { price: x.price, caseQty: n(x.su.caseQty) || x.caseQty, unit: n(x.su.caseQty) ? x.su.unit : x.unit, estimated: true });
        x.su.history = (x.su.history || []).concat([{ date: today(), price: x.price, src:"estimate" }]); priced++;
      } else {
        const ns = { id: uid("s"), name: x.product, cat: guessCat(x.product) || guessCat(x.label), supplier:"", code:"", caseQty: x.caseQty, unit: x.unit, yield: 1, price: x.price, estimated: true, history:[{ date: today(), price: x.price, src:"estimate" }] };
        r.supplies[ns.id] = ns; applyLink(x.lines, ns); added++;
      }
    });
    save(); dlg.close(); render();
    const flagged = Object.values(r.items).reduce((t, it) => t + (it.lines || []).filter(l => l.note).length, 0);
    toast("Added " + added + " estimated supplies" + (priced ? " and priced " + priced + " more" : "") + (flagged ? ". Amounts to check are outlined in orange" : "") + ".");
  };
  paint();
  openDlg("Check the estimates", [
    el("div",{class:"msg", style:"background:var(--warn-soft);color:var(--ink)", text:"These are typical distributor prices, not your prices. They're labeled \u201cAI estimate\u201d everywhere, and the first invoice or price sheet with the real price replaces them."}),
    el("div",{class:"tw", style:"margin-top:12px"}, el("table",null, el("thead",null, el("tr",null, el("th"), el("th",{text:"Ingredient"}), el("th",{text:"Typical product"}), el("th",{class:"num", text:"Case price"}), el("th",{class:"num", text:"Per unit"}))), tb)),
    el("p",{class:"mini", text:"Edit any price you know better. Untick anything you'd rather leave unpriced."}),
    failed ? el("p",{class:"mini", style:"color:var(--warn)", text: failed + " couldn't be estimated this time" + (aiProblem(lastErr) ? ": " + aiProblem(lastErr) : ". Run Estimate again later for the rest.")}) : null
  ], [el("span"), addBtn]);
}

boot();
})();
