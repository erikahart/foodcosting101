<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24221F">
<title>Kitchen book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#1F6F5C; --jade-pale:#D3E9DF; --mustard:#D99A1E; --ketchup:#B8352A; --char:#24221F;
  --bg:#F3F7F2; --panel:#FFFFFF; --ink:#24221F; --ink-2:#4A4741; --muted:#66655D; --line:#DCE4DA; --field:#F8FAF7; --warn-soft:#F6E6C0;
  --head:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root{ --bg:#18201C; --panel:#202924; --ink:#ECEFE9; --ink-2:#C9CFC8; --muted:#A3ACA4; --line:#2F3A33; --field:#1C241F; --jade-pale:#1F3A30; --warn-soft:#3A3120; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--char);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--char);z-index:6}
.top h1{margin:0;font-family:var(--head);font-weight:800;font-size:1.9rem;line-height:1;letter-spacing:.01em}
.top .sub{font-size:.8rem;color:#C8D0CB}
.top .grow{flex:1}
.search{min-width:220px;flex:0 1 340px;font:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:0;background:#3A3733;color:#fff;min-height:48px}
.search::placeholder{color:#B9B5AE}
.tbtn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #4A4640;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--jade);border-color:var(--jade)}
main{padding:20px 18px 40px;max-width:1400px;margin:0 auto}
.crumbs{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.back{min-height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.crumbs h2{margin:0;font-family:var(--head);font-weight:800;font-size:2.2rem;line-height:1}
.side{margin:0 0 26px}
.side h2{font-family:var(--head);font-weight:800;font-size:2rem;margin:0 0 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;min-height:130px;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--jade)}
.cat.bar::before{background:var(--mustard)}
.cat b{font-family:var(--head);font-weight:800;font-size:1.9rem;line-height:1}
.cat span{color:var(--muted);font-weight:600}
.cat:active,.card:active{transform:scale(.985)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:flex;flex-direction:column;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--panel);overflow:hidden;cursor:pointer;text-align:left}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--field);isolation:isolate;display:grid;place-items:center}
.ph.tall{aspect-ratio:3/4}
.ph img{position:absolute;inset:0}
.ph::before{content:"";position:absolute;inset:-24px;background:var(--bg-img,none) center/cover no-repeat;filter:blur(20px) brightness(.88);z-index:-1}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph .init{font-family:var(--head);font-weight:800;font-size:2.6rem;color:var(--muted);opacity:.6}
.ai{position:absolute;left:8px;top:8px;background:rgba(36,34,31,.82);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.card .nm{padding:12px 14px;border-top:2px solid color-mix(in srgb,var(--ketchup) 55%,transparent)}
.card .nm b{display:block;font-size:1.08rem;line-height:1.25}
.card .nm span{font-size:.85rem;color:var(--muted)}
.spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
.spec .ph{border-radius:16px;max-height:78vh}
.spec .ph.tall{aspect-ratio:3/4}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.facts span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.95rem}
.allergy{background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:1.05rem}
.spec h3{font-family:var(--head);font-weight:800;font-size:1.5rem;margin:18px 0 8px}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li{padding:9px 0;border-bottom:1px solid var(--line);font-size:1.12rem}
.ings b{display:inline-block;min-width:96px}
.steps{margin:0;padding-left:28px;display:grid;gap:12px;font-size:1.18rem}
.steps li::marker{font-weight:800;color:var(--jade)}
.note{white-space:pre-line;font-size:1.05rem}
.desc{color:var(--ink-2);font-size:1.05rem;margin:0 0 12px}
.empty,.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:1.05rem}
.status{font-size:.8rem;color:var(--muted);text-align:center;margin-top:30px}
.tabs{display:flex;gap:6px}
.tabs button{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #4A4640;background:transparent;color:#fff;font-weight:700;cursor:pointer}
.tabs button[aria-current="page"]{background:#fff;color:var(--char);border-color:#fff}
.day-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.day-h h2{margin:0;font-family:var(--head);font-weight:800;font-size:2.2rem;line-height:1}
.daynote{background:var(--warn-soft);border-radius:10px;padding:6px 12px;font-weight:700}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:22px}
.who > div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.who b{font-size:1.12rem}
.who .t{font-weight:600;color:var(--ink-2)}
.who .st{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--field);color:var(--muted);white-space:nowrap}
.who .st.on{background:var(--jade);color:#fff}
.role{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--jade-pale);color:var(--jade);margin-left:6px}
.wk{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.95rem}
.wk th,.wk td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.wk th.today,.wk td.today{background:color-mix(in srgb,var(--jade) 9%,transparent)}
.wk td{font-weight:600;white-space:nowrap}
.wk .off{color:#9A6A0B}
.wkwrap{overflow-x:auto;margin-bottom:12px}
.mine{display:grid;gap:8px;margin-bottom:22px}
.mine div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.08rem;display:flex;justify-content:space-between}
.duty{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.duty-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.duty-h h3{margin:0;font-family:var(--head);font-weight:800;font-size:1.6rem}
.prog{font-weight:700;border-radius:999px;padding:3px 12px;background:var(--field)}
.prog.all{background:var(--jade);color:#fff}
.chk{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--field);text-align:left;cursor:pointer;font-size:1.1rem}
.chk .box{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:#fff}
.chk.done{background:var(--jade-pale);border-color:transparent}
.chk.done .box{background:var(--jade);border-color:var(--jade)}
.chk.done .tx{text-decoration:line-through;color:var(--ink-2)}
.chk .by{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
.pick{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:20}
.pick > div{background:var(--panel);color:var(--ink);width:min(720px,100%);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.pick h3{margin:0 0 4px;font-family:var(--head);font-weight:800;font-size:1.6rem}
.pick .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.pick .names button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:1.05rem;cursor:pointer}
.tbtn.custom{background:var(--mustard);border-color:var(--mustard);color:#24221F}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;margin-bottom:18px}
.ask input{font:inherit;font-size:1.2rem;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);min-height:58px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.seg button{min-height:52px;padding:0 22px;border:0;background:var(--panel);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--char);color:#fff}
.go{min-height:58px;padding:0 26px;border-radius:12px;border:0;background:var(--jade);color:#fff;font-weight:700;font-size:1.1rem;cursor:pointer}
.go[disabled]{opacity:.6}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--mustard);color:#24221F;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.sub-note{font-size:.95rem;color:var(--muted)}
.miss{color:#9A6A0B;font-weight:600}
.saved{background:var(--jade-pale);border-radius:12px;padding:12px 14px;font-weight:600}
@media (max-width:1100px){ .search{flex:1 1 220px} }
@media (max-width:820px){ .tabs{flex:1 1 100%} .tabs button{flex:1}  .spec{grid-template-columns:1fr} .search{flex:1 1 100%} .cats,.grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>
<header class="top">
  <div><h1 id="kname">Kitchen book</h1><div class="sub">Kitchen tablet</div></div>
  <nav class="tabs" aria-label="Sections"><button id="nav-rec" type="button">Recipes</button><button id="nav-sched" type="button">Schedule</button><button id="nav-duty" type="button">Duties</button></nav>
  <div class="grow"></div>
  <input id="q" class="search" type="search" placeholder="Search drinks and dishes" aria-label="Search" autocomplete="off">
  <button id="custom" class="tbtn custom" type="button">Not on the menu?</button>
  <button id="wake" class="tbtn" type="button" aria-pressed="false">Keep screen on</button>
</header>
<main id="main"><div class="msg">Loading the Kitchen book…</div></main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); if (attrs) for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === "text") e.textContent = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v); } kids.flat().forEach(c => { if (c == null) return; e.append(c.nodeType ? c : document.createTextNode(c)); }); return e; };
  const token = (location.pathname.match(/\/tablet\/([A-Za-z0-9]{40,})/) || [])[1] || new URLSearchParams(location.search).get("k") || "";
  const CACHE = "kb-tablet-" + token.slice(0, 12);
  const cfg = window.APP_CONFIG || {};
  const sb = window.supabase && cfg.supabaseUrl ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false } }) : null;
  let BOOK = null, UPDATED = null, Q = "";
  const PH = new Map();
  const mins = v => v > 0 ? Math.round(v) + " min" : "";

  function view(){ const p = new URLSearchParams(location.hash.slice(1)); return { cat: p.get("cat"), card: p.get("card") }; }
  function go(v){ const p = new URLSearchParams(); if (v.cat) p.set("cat", v.cat); if (v.card) p.set("card", v.card); location.hash = p.toString(); }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  function photoEl(it, big){
    const url = PH.get(it.id);
    const box = h("div", { class:"ph" + (it.bar ? " tall" : "") });
    if (url){ box.style.setProperty("--bg-img", 'url("' + url + '")'); box.append(h("img", { src:url, alt: big ? it.name : "" })); }
    else box.append(h("span", { class:"init", text: (it.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() }));
    if (url && it.ai) box.append(h("span", { class:"ai", text:"AI image" }));
    return box;
  }
  const sideOf = it => it.bar ? "Bar" : "Kitchen";
  function sections(){
    const order = BOOK.sections || [], g = {};
    BOOK.items.forEach(it => { (g[it.section] = g[it.section] || []).push(it); });
    return Object.keys(g).sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999)).map(k => ({ name: k, items: g[k].sort((a, b) => a.order - b.order), bar: g[k].filter(x => x.bar).length * 2 > g[k].length }));
  }
  function cardGrid(list){
    return h("div", { class:"grid" }, list.map(it => h("button", { class:"card", type:"button", onclick: () => go({ cat: view().cat, card: it.id }) },
      photoEl(it), h("div", { class:"nm" }, h("b", { text: it.name }), h("span", { text: [it.section, mins((it.card.prepMin || 0) + (it.card.cookMin || 0))].filter(Boolean).join("  ·  ") })))));
  }
  function spec(it){
    const c = it.card, total = (c.prepMin || 0) + (c.cookMin || 0);
    const facts = [c.station, c.prepMin ? "Prep " + mins(c.prepMin) : "", c.cookMin ? (it.bar ? "Build " : "Cook ") + mins(c.cookMin) : "", total ? "Total " + mins(total) : "", c.yieldText ? "Makes " + c.yieldText : ""].filter(Boolean);
    return h("div", { class:"spec" },
      photoEl(it, true),
      h("div", null,
        it.desc ? h("p", { class:"desc", text: it.desc }) : null,
        facts.length ? h("div", { class:"facts" }, facts.map(f => h("span", { text: f }))) : null,
        (c.allergens || []).length ? h("div", { class:"allergy" }, h("b", { text:"Contains: " }), c.allergens.join(", ")) : null,
        h("h3", { text:"Ingredients" }),
        it.ings.length ? h("ul", { class:"ings" }, it.ings.map(x => h("li", null, h("b", { text: x.qty }), " " + x.name))) : h("p", { text:"Not listed yet." }),
        h("h3", { text: it.bar ? "Build" : "Steps" }),
        (c.steps || []).length ? h("ol", { class:"steps" }, c.steps.map(t => h("li", { text: t }))) : h("p", { text:"No steps written yet." }),
        c.plating ? h("div", null, h("h3", { text: it.bar ? "Glass and garnish" : "Plating" }), h("p", { class:"note", text: c.plating })) : null,
        c.notes ? h("div", null, h("h3", { text:"Notes" }), h("p", { class:"note", text: c.notes })) : null));
  }
  // "Not on the menu?": a quick spec for something without a card, made with AI. Nothing is saved unless they choose to.
  const CB = (() => { try { return JSON.parse(sessionStorage.getItem("kb-build") || "null") || {}; } catch(e){ return {}; } })();
  CB.kind = CB.kind || "drink";
  const keepCB = () => { try { sessionStorage.setItem("kb-build", JSON.stringify({ order: CB.order, kind: CB.kind, build: CB.build, saved: CB.saved })); } catch(e){} };
  async function runBuild(){
    if (!CB.order || CB.busy) return;
    CB.busy = true; CB.err = null; CB.build = null; CB.saved = false; render();
    try {
      const res = await fetch("/api/tablet-ai", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ token, order: CB.order, kind: CB.kind }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || "Couldn't build that right now.");
      CB.build = j.build;
    } catch(e){ CB.err = navigator.onLine ? e.message : "No internet connection right now. Try again when the Wi-Fi is back."; }
    CB.busy = false; keepCB(); render();
  }
  async function saveBuild(){
    if (!CB.build || !sb) return;
    const { data, error } = await sb.rpc("book_save_build", { p_token: token, p_prompt: CB.order, p_data: Object.assign({ kind: CB.kind }, CB.build) });
    CB.saved = !error && data === true; if (!CB.saved) CB.err = "Couldn't send it right now. Try again in a minute."; keepCB(); render();
  }
  function buildView(m){
    const input = h("input", { type:"text", placeholder: CB.kind === "drink" ? "What did the guest order? e.g. Long Island, Lemon Drop" : "What did the guest ask for? e.g. Grilled cheese with tomato", value: CB.order || "", "aria-label":"What the guest ordered", enterkeyhint:"go" });
    input.oninput = () => { CB.order = input.value.trim(); keepCB(); };
    input.onkeydown = e => { if (e.key === "Enter"){ CB.order = input.value.trim(); runBuild(); } };
    const seg = h("div", { class:"seg", role:"group", "aria-label":"Drink or dish" },
      [["drink","Drink"],["food","Dish"]].map(([k, l]) => h("button", { type:"button", "aria-pressed": String(CB.kind === k), text:l, onclick: () => { CB.kind = k; keepCB(); render(); } })));
    const parts = [h("div", { class:"crumbs" }, h("button", { class:"back", type:"button", text:"← All", onclick: () => go({}) }), h("h2", { text:"Not on the menu?" })),
      h("div", { class:"ask" }, h("div", { class:"row" }, seg), input,
        h("div", { class:"row" }, h("button", { class:"go", type:"button", disabled: CB.busy ? "" : null, text: CB.busy ? "Building…" : "Build it", onclick: () => { CB.order = input.value.trim(); runBuild(); } }),
          h("span", { class:"sub-note", text:"A quick spec using what you stock. Check it before serving." })))];
    if (CB.err) parts.push(h("div", { class:"msg", text: CB.err }));
    const b = CB.build;
    if (b){
      parts.push(h("div", { class:"spec", style:"grid-template-columns:1fr" }, h("div", null,
        h("div", { class:"row", style:"margin-bottom:8px" }, h("span", { class:"tag", text:"Custom build" }), h("h2", { style:"margin:0;font-family:var(--head);font-weight:800;font-size:2.2rem;line-height:1", text: b.name || CB.order })),
        b.description ? h("p", { class:"desc", text: b.description }) : null,
        (b.glass || b.garnish) ? h("div", { class:"facts" }, b.glass ? h("span", { text:"Glass: " + b.glass }) : null, b.garnish ? h("span", { text:"Garnish: " + b.garnish }) : null) : null,
        (b.allergens || []).length ? h("div", { class:"allergy" }, h("b", { text:"Contains: " }), b.allergens.join(", ")) : null,
        h("h3", { text:"Ingredients" }),
        h("ul", { class:"ings" }, (b.ingredients || []).map(x => h("li", null, h("b", { text: x.qty || "" }), " " + (x.name || ""),
          x.inStock === false ? h("div", { class:"miss", text: "Not stocked" + (x.substitute ? ". Use: " + x.substitute : "") }) : null))),
        h("h3", { text: CB.kind === "drink" ? "Build" : "Steps" }),
        h("ol", { class:"steps" }, (b.steps || []).map(s => h("li", { text: s }))),
        b.plating ? h("div", null, h("h3", { text:"Plating" }), h("p", { class:"note", text: b.plating })) : null,
        b.notes ? h("div", null, h("h3", { text:"Notes" }), h("p", { class:"note", text: b.notes })) : null,
        h("div", { class:"row", style:"margin-top:18px" },
          CB.saved ? h("div", { class:"saved", text:"Sent to the manager. It's in the app's Test kitchen to cost and maybe add to the menu." })
                   : h("button", { class:"go", type:"button", text:"Save for the manager", onclick: saveBuild }),
          h("button", { class:"back", type:"button", text:"New build", onclick: () => { CB.order = ""; CB.build = null; CB.saved = false; CB.err = null; keepCB(); render(); } })))));
    }
    m.replaceChildren(...parts, status());
    if (!b && !CB.busy) setTimeout(() => input.focus(), 50);
  }
  // ---------- Schedule and duties ----------
  const localDay = (d = new Date()) => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
  const addDays = (iso, k) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + k); return localDay(d); };
  const mondayOf = iso => addDays(iso, -((new Date(iso + "T12:00:00").getDay() + 6) % 7));
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const t12 = (v, short) => { if (!v) return "close"; const [hh, mm] = v.split(":").map(Number), ap = hh >= 12 ? (short ? "p" : " PM") : (short ? "a" : " AM"), h12 = hh % 12 || 12; return short ? h12 + (mm ? ":" + String(mm).padStart(2, "0") : "") + ap : h12 + ":" + String(mm).padStart(2, "0") + ap; };
  const S = () => BOOK.schedule || { people: [], shifts: [], notes: {}, codes: {} };
  const pname = id => (S().people.find(p => p.id === id) || {}).name || "";
  const roleLabel = r => r ? ((S().codes || {})[r] || r) : "";
  const shiftTxt = (x, short) => x.off ? (x.n || "Off") : t12(x.s, short) + (short ? "\u2013" : " \u2013 ") + t12(x.e, short);
  let SCH_WEEK = 0, SCH_ME = "";
  function schedView(m){
    const sc = S(), today = localDay(), dt = new Date(today + "T12:00:00");
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), toMin = v => v ? +v.slice(0, 2) * 60 + +v.slice(3) : 24 * 60;
    const todays = sc.shifts.filter(x => x.d === today && !x.off).sort((a, b) => (a.s || "").localeCompare(b.s || ""));
    const parts = [h("div", { class:"day-h" }, h("h2", { text:"Today, " + DOWL[dt.getDay()] + " " + dt.toLocaleDateString(undefined, { month:"short", day:"numeric" }) }), sc.notes[today] ? h("span", { class:"daynote", text: sc.notes[today] }) : null)];
    parts.push(todays.length ? h("div", { class:"who" }, todays.map(x => { const on = mins >= toMin(x.s) && mins < toMin(x.e), done = mins >= toMin(x.e);
      return h("div", null, h("div", null, h("b", { text: pname(x.p) }), x.r ? h("span", { class:"role", text: roleLabel(x.r) }) : null, h("div", { class:"t", text: shiftTxt(x) })), h("span", { class:"st" + (on ? " on" : ""), text: on ? "On now" : done ? "Done" : "Later" })); }))
      : h("div", { class:"empty", text:"No one is scheduled today." }));
    // A person's own shifts
    const sel = h("select", { class:"back", "aria-label":"Show one person's shifts", style:"min-height:52px" }, h("option", { value:"", text:"Show my shifts\u2026" }), sc.people.map(p => h("option", { value:p.id, text:p.name })));
    sel.value = SCH_ME; sel.onchange = () => { SCH_ME = sel.value; render(); };
    parts.push(h("div", { class:"row", style:"margin-bottom:12px" }, sel));
    if (SCH_ME){ const mine = sc.shifts.filter(x => x.p === SCH_ME && x.d >= today).sort((a, b) => a.d.localeCompare(b.d) || (a.s || "").localeCompare(b.s || ""));
      parts.push(h("div", { class:"mine" }, mine.length ? mine.map(x => { const d2 = new Date(x.d + "T12:00:00"); return h("div", null, h("span", { text: (x.d === today ? "Today" : DOWL[d2.getDay()]) + " " + d2.toLocaleDateString(undefined, { month:"short", day:"numeric" }) }), h("b", { class: x.off ? "off" : "", text: shiftTxt(x) + (x.r ? "  (" + roleLabel(x.r) + ")" : "") })); }) : h("div", { text:"No upcoming shifts posted." }))); }
    // The week grid
    const wk = addDays(mondayOf(today), SCH_WEEK * 7), days = [...Array(7)].map((_, i) => addDays(wk, i)).filter((d, i) => i > 0 || sc.shifts.some(x => x.d === d));
    const people = sc.people.filter(p => sc.shifts.some(x => x.p === p.id && x.d >= wk && x.d < addDays(wk, 7)));
    parts.push(h("div", { class:"row", style:"margin:4px 0 10px" }, h("h3", { style:"margin:0;font-family:var(--head);font-weight:800;font-size:1.6rem", text: SCH_WEEK === 0 ? "This week" : "Next week" }),
      h("div", { class:"seg" }, h("button", { type:"button", "aria-pressed": String(SCH_WEEK === 0), text:"This week", onclick: () => { SCH_WEEK = 0; render(); } }), h("button", { type:"button", "aria-pressed": String(SCH_WEEK === 1), text:"Next week", onclick: () => { SCH_WEEK = 1; render(); } }))));
    parts.push(people.length ? h("div", { class:"wkwrap" }, h("table", { class:"wk" },
      h("thead", null, h("tr", null, h("th", { text:"" }), days.map(d => { const d2 = new Date(d + "T12:00:00"); return h("th", { class: d === today ? "today" : "" }, DOW[d2.getDay()] + " " + d2.getDate(), sc.notes[d] ? h("div", { class:"daynote", style:"font-size:.72rem;padding:1px 6px;margin-top:3px", text: sc.notes[d] }) : null); }))),
      h("tbody", null, people.map(p => h("tr", null, h("th", { text: p.name }), days.map(d => h("td", { class: d === today ? "today" : "" },
        sc.shifts.filter(x => x.p === p.id && x.d === d).map(x => h("div", { class: x.off ? "off" : "" }, shiftTxt(x, true), x.r ? h("span", { class:"role", text: roleLabel(x.r) }) : null))))))))) : h("div", { class:"empty", text:"No schedule posted for this week yet." }));
    m.replaceChildren(...parts, status());
  }
  let CHECKS = new Map(), CHECKS_DAY = "", checkTimer = null;
  async function loadChecks(){
    const day = localDay(); if (!sb) return;
    const { data, error } = await sb.rpc("book_duty_checks", { p_token: token, p_day: day });
    if (!error){ CHECKS = new Map((data || []).map(c => [c.list_id + "|" + c.item_id, c])); CHECKS_DAY = day; if (location.hash === "#duties") render(); }
  }
  function namePicker(title, onPick){
    const today = localDay(), sc = S();
    const names = [...new Set(sc.shifts.filter(x => x.d === today && !x.off).map(x => pname(x.p)).filter(Boolean))];
    const wrap = h("div", { class:"pick", onclick: e => { if (e.target === wrap) wrap.remove(); } },
      h("div", null, h("h3", { text:"Who did it?" }), h("div", { class:"sub-note", text: title }),
        h("div", { class:"names" }, names.map(nm => h("button", { type:"button", text: nm, onclick: () => { wrap.remove(); onPick(nm); } })),
          h("button", { type:"button", text:"Someone else", onclick: () => { const v = prompt("Your name:"); if (v && v.trim()){ wrap.remove(); onPick(v.trim()); } } })),
        h("button", { class:"back", type:"button", text:"Cancel", onclick: () => wrap.remove() })));
    document.body.append(wrap);
  }
  async function setDuty(l, it, by, done){
    const day = localDay(), key = l.id + "|" + it.id;
    if (done) CHECKS.set(key, { list_id: l.id, item_id: it.id, done_by: by, done_at: new Date().toISOString() }); else CHECKS.delete(key);
    render();
    const { data, error } = await sb.rpc("book_duty_set", { p_token: token, p_day: day, p_list: l.id, p_item: it.id, p_by: by || null, p_done: done });
    if (error || data !== true){ alert("That didn't save. Check the Wi-Fi and try again."); loadChecks(); }
  }
  function dutiesView(m){
    const today = localDay(), dn = new Date(today + "T12:00:00").getDay();
    if (CHECKS_DAY !== today) loadChecks();
    const order = { open:0, mid:1, daily:2, close:3 };
    const lists = (BOOK.duties || []).filter(l => !l.days || !l.days.length || l.days.includes(dn)).sort((a, b) => (order[a.when] - order[b.when]) || a.area.localeCompare(b.area));
    const parts = [h("div", { class:"day-h" }, h("h2", { text:"Duties for " + DOWL[dn] }), h("span", { class:"sub-note", text:"Tap a duty when it's done, then tap your name." }))];
    if (!lists.length) parts.push(h("div", { class:"empty", text:"No checklists set up for today. Managers add them in the app under Schedule \u2192 Duties." }));
    lists.forEach(l => { const n = l.items.filter(x => CHECKS.has(l.id + "|" + x.id)).length;
      parts.push(h("section", { class:"duty" }, h("div", { class:"duty-h" }, h("h3", { text: l.name }), h("span", { class:"prog" + (n === l.items.length && n ? " all" : ""), text: n + " of " + l.items.length })),
        l.items.map(x => { const c = CHECKS.get(l.id + "|" + x.id);
          return h("button", { class:"chk" + (c ? " done" : ""), type:"button", onclick: () => { if (c){ if (confirm("Mark \u201c" + x.text + "\u201d as not done?")) setDuty(l, x, null, false); } else namePicker(x.text, nm => setDuty(l, x, nm, true)); } },
            h("span", { class:"box", text: c ? "\u2713" : "" }), h("span", { class:"tx", text: x.text }),
            c ? h("span", { class:"by", text: (c.done_by || "") + " " + new Date(c.done_at).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) }) : null); }))); });
    m.replaceChildren(...parts, status());
    clearInterval(checkTimer); checkTimer = setInterval(() => { if (location.hash === "#duties") loadChecks(); else clearInterval(checkTimer); }, 60000);
  }
  function markNav(){ const hsh = location.hash; $("nav-rec").setAttribute("aria-current", hsh === "#sched" || hsh === "#duties" ? "false" : "page"); $("nav-sched").setAttribute("aria-current", hsh === "#sched" ? "page" : "false"); $("nav-duty").setAttribute("aria-current", hsh === "#duties" ? "page" : "false"); }
  function render(){
    const m = $("main"); if (!BOOK) return; markNav();
    if (location.hash === "#sched"){ $("kname").textContent = BOOK.name || "Kitchen book"; schedView(m); return; }
    if (location.hash === "#duties"){ $("kname").textContent = BOOK.name || "Kitchen book"; dutiesView(m); return; }
    if (location.hash === "#build"){ $("kname").textContent = BOOK.name || "Kitchen book"; buildView(m); return; }
    $("kname").textContent = BOOK.name || "Kitchen book"; document.title = (BOOK.name || "Kitchen") + " book";
    const v = view(), secs = sections();
    if (v.card){
      const it = BOOK.items.find(x => x.id === v.card);
      if (!it){ go({ cat: v.cat }); return; }
      m.replaceChildren(h("div", { class:"crumbs" }, h("button", { class:"back", type:"button", text:"\u2190 " + (v.cat || "Back"), onclick: () => history.back() }), h("h2", { text: it.name })), spec(it), status());
      needPhotos([it]); return;
    }
    if (Q){
      const q = Q.toLowerCase(), hits = BOOK.items.filter(it => (it.name + " " + it.section + " " + it.ings.map(x => x.name).join(" ")).toLowerCase().includes(q));
      m.replaceChildren(h("div", { class:"crumbs" }, h("h2", { text: hits.length + (hits.length === 1 ? " match" : " matches") })), hits.length ? cardGrid(hits) : h("div", { class:"empty", text:"Nothing matches \u201c" + Q + "\u201d." }), status());
      needPhotos(hits); return;
    }
    if (v.cat){
      const sec = secs.find(x => x.name === v.cat);
      if (!sec){ go({}); return; }
      m.replaceChildren(h("div", { class:"crumbs" }, h("button", { class:"back", type:"button", text:"\u2190 All", onclick: () => go({}) }), h("h2", { text: sec.name })), cardGrid(sec.items), status());
      needPhotos(sec.items); return;
    }
    const side = (title, list) => list.length ? h("section", { class:"side" }, h("h2", { text: title }),
      h("div", { class:"cats" }, list.map(sec => h("button", { class:"cat" + (sec.bar ? " bar" : ""), type:"button", onclick: () => go({ cat: sec.name }) }, h("b", { text: sec.name }), h("span", { text: sec.items.length + (sec.bar ? (sec.items.length === 1 ? " drink" : " drinks") : (sec.items.length === 1 ? " item" : " items")) }))))) : null;
    m.replaceChildren(...[side("Bar", secs.filter(x => x.bar)), side("Kitchen", secs.filter(x => !x.bar)), BOOK.items.length ? null : h("div", { class:"empty", text:"No recipe cards yet." }), status()].filter(Boolean));
  }
  function status(){ return h("p", { class:"status", text: UPDATED ? "Updated " + new Date(UPDATED).toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) + (navigator.onLine ? "" : "  ·  offline, showing the last copy") : "" }); }

  // Photos load as cards come into view, and are kept for offline use.
  let photoQueue = new Set(), photoTimer = null;
  function needPhotos(list){ list.filter(it => it.photo && !PH.has(it.id)).forEach(it => photoQueue.add(it.id)); if (photoQueue.size && !photoTimer) photoTimer = setTimeout(fetchPhotos, 30); }
  async function fetchPhotos(){
    photoTimer = null; if (!sb) return;
    const ids = [...photoQueue].slice(0, 24); ids.forEach(i => photoQueue.delete(i));
    const { data, error } = await sb.rpc("book_public_photos", { p_token: token, p_items: ids });
    if (!error && data){ data.forEach(p => PH.set(p.item_id, p.data)); savePhotos(); render(); }
    if (photoQueue.size) photoTimer = setTimeout(fetchPhotos, 30);
  }
  function savePhotos(){ try { localStorage.setItem(CACHE + "-ph", JSON.stringify([...PH.entries()].slice(-80))); } catch(e){} }

  async function load(first){
    if (!token){ $("main").replaceChildren(h("div", { class:"msg", text:"This tablet link is missing its code. Open the full link from the app (Kitchen book \u2192 Tablet link)." })); return; }
    try {
      if (!sb) throw new Error("offline");
      const { data, error } = await sb.rpc("book_public", { p_token: token });
      if (error) throw error;
      if (!data){ localStorage.removeItem(CACHE); $("main").replaceChildren(h("div", { class:"msg", text:"This tablet link isn't active anymore. Ask a manager for the new link (Kitchen book \u2192 Tablet link in the app)." })); return; }
      if (first || data.updated_at !== UPDATED){ BOOK = data.book; UPDATED = data.updated_at; try { localStorage.setItem(CACHE, JSON.stringify({ book: BOOK, updated_at: UPDATED })); } catch(e){} render(); }
    } catch(e){
      if (first){ try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if (c){ BOOK = c.book; UPDATED = c.updated_at; render(); return; } } catch(x){}
        $("main").replaceChildren(h("div", { class:"msg", text:"Couldn't reach the Kitchen book. Check the Wi-Fi; it will try again automatically." })); }
    }
  }
  try { JSON.parse(localStorage.getItem(CACHE + "-ph") || "[]").forEach(([k, v]) => PH.set(k, v)); } catch(e){}
  $("q").addEventListener("input", e => { Q = e.target.value.trim(); if (location.hash === "#build") location.hash = ""; render(); });
  $("custom").onclick = () => { location.hash = "build"; };
  $("nav-rec").onclick = () => { location.hash = ""; };
  $("nav-sched").onclick = () => { location.hash = "sched"; };
  $("nav-duty").onclick = () => { location.hash = "duties"; };

  // Keep the screen awake during service (where the tablet supports it).
  let lock = null, wantWake = false;
  async function wake(on){ wantWake = on; $("wake").setAttribute("aria-pressed", String(on));
    try { if (on && "wakeLock" in navigator){ lock = await navigator.wakeLock.request("screen"); } else if (lock){ await lock.release(); lock = null; } } catch(e){} }
  $("wake").onclick = () => wake(!wantWake);
  document.addEventListener("visibilitychange", () => { if (wantWake && document.visibilityState === "visible") wake(true); if (document.visibilityState === "visible") load(false); });
  if (!("wakeLock" in navigator)) $("wake").hidden = true;

  load(true);
  setInterval(() => load(false), 3 * 60 * 1000);
})();
