<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24221F">
<title>Fox Den Kitchen book</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kitchen book">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#1F6F5C; --jade-pale:#D3E9DF; --mustard:#D99A1E; --ketchup:#B8352A; --char:#24221F;
  --bg:#F3F7F2; --panel:#FFFFFF; --ink:#24221F; --ink-2:#4A4741; --muted:#66655D; --line:#DCE4DA; --field:#F8FAF7; --warn-soft:#F6E6C0;
  --head:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root{ --bg:#18201C; --panel:#202924; --ink:#ECEFE9; --ink-2:#C9CFC8; --muted:#A3ACA4; --line:#2F3A33; --field:#1C241F; --jade-pale:#1F3A30; --warn-soft:#3A3120; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--char);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;top:0;right:0;bottom:auto;left:0;height:env(safe-area-inset-top,0px);background:var(--char);z-index:6}
.top h1{margin:0;font-family:var(--head);font-weight:800;font-size:1.9rem;line-height:1;letter-spacing:.01em}
.top .sub{font-size:.8rem;color:#C8D0CB}
.top .grow{flex:1}
.search{min-width:220px;flex:0 1 340px;font:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:0;background:#3A3733;color:#fff;min-height:48px}
.search::placeholder{color:#B9B5AE}
.tbtn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #4A4640;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--jade);border-color:var(--jade)}
main{padding:20px 18px 40px;max-width:1400px;margin:0 auto}
.crumbs{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.back{min-height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.crumbs h2{margin:0;font-family:var(--head);font-weight:800;font-size:2.2rem;line-height:1}
.side{margin:0 0 26px}
.side h2{font-family:var(--head);font-weight:800;font-size:2rem;margin:0 0 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;min-height:130px;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--jade)}
.cat.bar::before{background:var(--mustard)}
.cat b{font-family:var(--head);font-weight:800;font-size:1.9rem;line-height:1}
.cat.has-pics{justify-content:flex-start;padding-top:0;padding-left:0;padding-right:0}
.cat.has-pics b,.cat.has-pics span{padding:0 18px}
.cat.has-pics b{margin-top:12px}
.cat-pics{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:100%;height:96px;margin-bottom:2px;background:var(--field)}
.cat-pics img,.cat-pic-wait{width:100%;height:96px;object-fit:cover;display:block;background:var(--field)}
.cat-pics img:only-child{grid-column:1/-1}
.cat-pics.none{display:grid;place-items:center;grid-template-columns:1fr;background:color-mix(in srgb,var(--mustard) 14%,var(--field))}
.cat:not(.bar) .cat-pics.none{background:color-mix(in srgb,var(--jade) 12%,var(--field))}
.cat-pics.none span{font-family:var(--head);font-weight:800;font-size:3rem;color:var(--ink);opacity:.18}
.cat span{color:var(--muted);font-weight:600}
.cat:active,.card:active{transform:scale(.985)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:flex;flex-direction:column;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--panel);overflow:hidden;cursor:pointer;text-align:left}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--field);isolation:isolate;display:grid;place-items:center}
.ph.tall{aspect-ratio:3/4}
.ph img{position:absolute;top:0;right:0;bottom:0;left:0}
/* Older iPad Safari can't size a box from aspect-ratio alone when its only content is positioned, so cards use the
   padding trick instead: the frame's height comes from its width, and the photo fills it. */
.card .ph{aspect-ratio:auto;height:0;padding-top:100%}
.card .ph.tall{padding-top:133.33%}
.card .ph .init{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center}
.spec .ph{aspect-ratio:auto;height:auto;padding:0;display:block}
.spec .ph img{position:static;width:100%;height:auto;max-height:78vh;object-fit:contain;display:block;margin:0 auto}
.spec .ph .init{display:grid;place-items:center;min-height:260px}
.ph::before{content:"";position:absolute;top:-24px;right:-24px;bottom:-24px;left:-24px;background:var(--bg-img,none) center/cover no-repeat;filter:blur(20px) brightness(.88);z-index:-1}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph .init{font-family:var(--head);font-weight:800;font-size:2.6rem;color:var(--muted);opacity:.6}
.ai{position:absolute;left:8px;top:8px;background:rgba(36,34,31,.82);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.card .nm{padding:12px 14px;border-top:2px solid color-mix(in srgb,var(--ketchup) 55%,transparent)}
.card .nm b{display:block;font-size:1.08rem;line-height:1.25}
.card .nm span{font-size:.85rem;color:var(--muted)}
.spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
.spec .ph{border-radius:16px;max-height:78vh}
.spec .ph.tall{aspect-ratio:3/4}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.facts span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.95rem}
.allergy{background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:1.05rem}
.spec h3{font-family:var(--head);font-weight:800;font-size:1.5rem;margin:18px 0 8px}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li{padding:9px 0;border-bottom:1px solid var(--line);font-size:1.12rem}
.ings b{display:inline-block;min-width:96px}
.steps{margin:0;padding-left:28px;display:grid;gap:12px;font-size:1.18rem}
.steps li::marker{font-weight:800;color:var(--jade)}
.note{white-space:pre-line;font-size:1.05rem}
.desc{color:var(--ink-2);font-size:1.05rem;margin:0 0 12px}
.empty,.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:1.05rem}
.status{font-size:.8rem;color:var(--muted);text-align:center;margin-top:30px}
.tabs{display:flex;gap:6px}
.tabs button{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #4A4640;background:transparent;color:#fff;font-weight:700;cursor:pointer}
.tabs button[aria-current="page"]{background:#fff;color:var(--char);border-color:#fff}
.day-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.day-h h2{margin:0;font-family:var(--head);font-weight:800;font-size:2.2rem;line-height:1}
.daynote{background:var(--warn-soft);border-radius:10px;padding:6px 12px;font-weight:700}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:22px}
.who > div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.who b{font-size:1.12rem}
.who .t{font-weight:600;color:var(--ink-2)}
.who .st{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--field);color:var(--muted);white-space:nowrap}
.who .st.on{background:var(--jade);color:#fff}
.role{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--jade-pale);color:var(--jade);margin-left:6px}
.wk{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.95rem}
.wk th,.wk td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.wk th.today,.wk td.today{background:color-mix(in srgb,var(--jade) 9%,transparent)}
.wk td{font-weight:600;white-space:nowrap}
.wk .off{color:#9A6A0B}
.wkwrap{overflow-x:auto;margin-bottom:12px}
.mine{display:grid;gap:8px;margin-bottom:22px}
.mine div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.08rem;display:flex;justify-content:space-between}
.duty{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.duty-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.duty-h h3{margin:0;font-family:var(--head);font-weight:800;font-size:1.6rem}
.prog{font-weight:700;border-radius:999px;padding:3px 12px;background:var(--field)}
.prog.all{background:var(--jade);color:#fff}
.chk{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--field);text-align:left;cursor:pointer;font-size:1.1rem}
.chk .box{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:#fff}
.chk.done{background:var(--jade-pale);border-color:transparent}
.chk.done .box{background:var(--jade);border-color:var(--jade)}
.chk.done .tx{text-decoration:line-through;color:var(--ink-2)}
.chk .by{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
.pick{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:20}
.pick > div{background:var(--panel);color:var(--ink);width:min(720px,100%);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.pick h3{margin:0 0 4px;font-family:var(--head);font-weight:800;font-size:1.6rem}
.pick .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.pick .names.two{grid-template-columns:1fr 1fr}
.pick .names .okb{background:var(--jade);color:#fff;border-color:var(--jade);min-height:78px;font-size:1.2rem}
.pick .names .cantb{background:var(--warn-soft);border-color:var(--mustard);min-height:78px;font-size:1.2rem}
.why-in{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);min-height:54px}
.chk.excused{background:var(--field);border-style:dashed;color:var(--muted)} .chk.excused .tx{text-decoration:line-through} .chk.excused .box{color:var(--muted)}
.chk.skipped{background:var(--warn-soft);border-color:transparent}
.chk.skipped .box{background:var(--mustard);border-color:var(--mustard)}
.chk.skipped .by{color:#9A6A0B;white-space:normal;text-align:right;max-width:45%}
.pick .names button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:1.05rem;cursor:pointer}

/* ---------- Schedule: day strip and timeline ---------- */
.daystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 16px;scrollbar-width:none}
.daystrip button{flex:none;min-width:104px;min-height:78px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:6px 10px}
.daystrip b{font-family:var(--head);font-weight:800;font-size:1.45rem;line-height:1}
.daystrip span{font-size:.85rem;font-weight:600;color:var(--ink-2)}
.daystrip i{font-style:normal;font-size:.75rem;font-weight:700;color:var(--muted)}
.daystrip button.none{opacity:.55}
.daystrip button[aria-selected="true"]{background:var(--char);border-color:var(--char);color:#fff}
.daystrip button[aria-selected="true"] span,.daystrip button[aria-selected="true"] i{color:#D8DCD6}
.tl{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px 14px;overflow:hidden}
.tl-head,.tl-row{display:grid;grid-template-columns:minmax(150px,22%) 1fr;gap:12px;align-items:center}
.tl-head{height:30px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tl-axis{position:relative;height:100%}
.tl-axis span{position:absolute;top:6px;transform:translateX(-50%);font-size:.78rem;font-weight:700;color:var(--muted)}
.tl-axis span:first-child{transform:none} .tl-axis span:last-child{transform:translateX(-100%)}
.tl-group.pos{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px;padding:4px 0 4px 12px;border-left:6px solid var(--pc);color:var(--ink);font-size:1.4rem}
.tl-group.pos i{font-style:normal;font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--muted)}
.nowstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin:0 0 14px}
.nowlbl{align-self:center;font-family:var(--head);font-weight:800;font-size:1.3rem;margin-right:4px}
.nowpos{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column}
.nowpos span{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.nowpos b{font-size:1.1rem}
.tl-group{font-family:var(--head);font-weight:800;font-size:1.15rem;color:var(--muted);margin:12px 0 4px;letter-spacing:.02em}
.tl-row{min-height:56px;border-radius:12px}
.tl-row.now{background:color-mix(in srgb,var(--jade) 8%,transparent)}
.tl-name{padding-left:6px}
.tl-name b{font-size:1.18rem}
.tl-track{position:relative;height:44px;background-image:linear-gradient(90deg,var(--line) 0 1px,transparent 1px);background-size:calc(100% / var(--n,8)) 100%;background-repeat:repeat-x;border-right:1px solid var(--line)}
.tl-bar{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--jade);color:#fff;display:flex;align-items:center;padding:0 12px;overflow:hidden;min-width:96px}
.tl-bar.bar{background:var(--mustard);color:#24221F}
.tl-bar.toclose{border-top-right-radius:0;border-bottom-right-radius:0;background-image:linear-gradient(90deg,transparent 85%,rgba(255,255,255,.35))}
.tl-bar span{font-weight:700;font-size:1.02rem;white-space:nowrap}
.tl-nowline{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--ketchup);z-index:2;pointer-events:none}
.tl-nowtag{position:absolute;top:2px;transform:translateX(-50%);background:var(--ketchup);color:#fff;font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;z-index:3}
.offs{margin:12px 2px 0;font-size:1.02rem}
.mysel{min-height:56px;font:inherit;font-size:1.05rem;font-weight:700;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
@media (max-width:820px){ .tl-head,.tl-row{grid-template-columns:118px 1fr;gap:8px} .tl-name b{font-size:1.02rem} .tl-bar span{font-size:.9rem} .tl-bar{padding:0 8px;min-width:84px}
 }
.area-seg{margin:0 0 14px} .area-seg button{min-height:52px;padding:0 22px;font-size:1.05rem}
.req-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:14px;font-weight:600}
.req-panel{max-height:88vh;overflow:auto}
.req-panel .names button{white-space:pre-line}
.req-panel .names button[aria-pressed="true"]{background:var(--char);color:#fff;border-color:var(--char)}
.req-panel textarea.why-in,.req-panel select.why-in{margin-top:12px}
.req-dates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.req-dates label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.myreq{display:grid;gap:8px;margin:0 0 14px}
.myreq h3{margin:0;font-family:var(--head);font-weight:800;font-size:1.4rem}
.rq{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rq-st{font-weight:800;border-radius:999px;padding:3px 12px;background:var(--field)}
.rq.approved .rq-st{background:var(--jade);color:#fff} .rq.denied .rq-st{background:var(--ketchup);color:#fff} .rq.pending .rq-st{background:var(--warn-soft);color:#7a5200}
.evlist{display:grid;gap:10px;margin-bottom:18px}
.today-box{margin:0 0 22px}
.today-box .spread-t{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.today-box h2{margin:0;font-family:var(--head);font-weight:800;font-size:2rem}
.ev-modes{margin:0 0 14px} .ev-modes button{min-height:52px;padding:0 22px;font-size:1.05rem}
.ev-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.ev-left{position:sticky;top:96px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px}
.mcal-h{text-align:center;font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.mcal-d{min-height:78px;border:1px solid var(--line);border-radius:10px;background:var(--field);display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:5px;cursor:pointer;text-align:left;overflow:hidden;color:var(--ink)}
.mcal-d.out{visibility:hidden}
.mcal-d.past{opacity:.5}
.mcal-d.today{border-color:var(--jade);border-width:2px}
.mcal-d.today .mcal-n{background:var(--jade);color:#fff;border-radius:999px;padding:0 7px}
.mcal-d.sel{background:var(--char);border-color:var(--char);color:#fff}
.mcal-d.sel .mcal-first{color:#D8DCD6}
.mcal-n{font-family:var(--head);font-weight:800;font-size:1.2rem;line-height:1.1}
.mcal-dots{display:flex;align-items:center;gap:3px}
.mcal-dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mcal-dots em{font-style:normal;font-size:.7rem;font-weight:800;margin-left:2px}
.mcal-first{font-size:.68rem;font-weight:700;line-height:1.2;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mcal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.mcal-legend span{display:inline-flex;align-items:center;gap:5px} .mcal-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ev-righth{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.ev-righth h3{margin:0;font-family:var(--head);font-weight:800;font-size:1.6rem}
.ev-right .ev-day{grid-template-columns:96px 1fr;gap:10px}
.ev-right .ev{grid-template-columns:1fr;gap:4px;font-size:1rem}
button.ev-date{border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;padding-top:10px}
@media (max-width:900px){ .ev-split{grid-template-columns:1fr} .ev-left{position:static} }
.ev-monthnav{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.ev-monthnav h2{margin:0;font-family:var(--head);font-weight:800;font-size:2.1rem;min-width:260px;text-align:center}

<header class="top">

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); if (attrs) for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === "text") e.textContent = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v); } kids.flat().forEach(c => { if (c == null) return; e.append(c.nodeType ? c : document.createTextNode(c)); }); return e; };
  const STAFF_KEY = "fd-staff", staffDev = () => { try { return JSON.parse(localStorage.getItem(STAFF_KEY) || "null"); } catch(e){ return null; } };
  const JOIN = (location.pathname.match(/\/join\/([a-f0-9]{40,})/) || [])[1] || new URLSearchParams(location.search).get("join") || "";
  const token = (location.pathname.match(/\/tablet\/([A-Za-z0-9]{40,})/) || [])[1] || new URLSearchParams(location.search).get("k") || (!JOIN && staffDev() ? staffDev().book : "") || "";
  let ME = null;   // { name, key } on a staff member's own phone
  const CACHE = "kb-tablet-" + token.slice(0, 12);
  const cfg = window.APP_CONFIG || {};
  const sb = window.supabase && cfg.supabaseUrl ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false } }) : null;
  let BOOK = null, UPDATED = null, Q = "";
  const PH = new Map();
  const mins = v => v > 0 ? Math.round(v) + " min" : "";

  function view(){ const p = new URLSearchParams(location.hash.slice(1)); return { cat: p.get("cat"), card: p.get("card") }; }
  function go(v){ const p = new URLSearchParams(); if (v.cat) p.set("cat", v.cat); if (v.card) p.set("card", v.card); location.hash = p.toString(); }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  function photoEl(it, big){
    const url = PH.get(it.id);
    const box = h("div", { class:"ph" + (it.bar ? " tall" : "") });
    if (url){ box.style.setProperty("--bg-img", 'url("' + url + '")'); box.append(h("img", { src:url, alt: big ? it.name : "" })); }
    else box.append(h("span", { class:"init", text: (it.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() }));
    if (url && it.ai) box.append(h("span", { class:"ai", text:"AI image" }));
    return box;
  }
  const sideOf = it => it.bar ? "Bar" : "Kitchen";
  function sections(){
    const order = BOOK.sections || [], g = {};
    BOOK.items.filter(it => !it.hidden).forEach(it => { (g[it.section] = g[it.section] || []).push(it); });
    return Object.keys(g).sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999)).map(k => ({ name: k, items: g[k].sort((a, b) => a.order - b.order), bar: g[k].filter(x => x.bar).length * 2 > g[k].length }));
  }
  // ---------- What's new: recipe changes and announcements, with "Got it" ----------
  let SEEN = new Map(), SEEN_AT = 0;   // change id -> [names]
  function loadSeen(force){
    if (!sb || (!force && Date.now() - SEEN_AT < 60000)) return; SEEN_AT = Date.now();
    sb.rpc("book_change_acks", { p_token: token }).then(({ data, error }) => { if (error) return; SEEN = new Map(); (data || []).forEach(a => { if (!SEEN.has(a.change_id)) SEEN.set(a.change_id, []); SEEN.get(a.change_id).push(a.name); }); render(); });
  }
  const recentChanges = days => (BOOK.changes || []).filter(c => Date.now() - Date.parse(c.at) < (days || 14) * 864e5);
  const changeFor = id => recentChanges(14).find(c => c.itemId === id);
  const unseen = () => recentChanges(14).filter(c => !(ME && (SEEN.get(c.id) || []).includes(ME.name)));
  const diffList = c => (c.diffs || []).length ? h("ul", { class:"diffs" }, c.diffs.slice(0, 10).map(d => h("li", null, h("span", { class:"dl", text: d.label + ": " }), d.old ? h("s", { text: d.old }) : null, d.old ? " \u2192 " : "", h("mark", { text: d.now })))) : null;
  async function gotIt(c){
    const send = async nm => { const { data } = await sb.rpc("book_change_ack", { p_token: token, p_change: c.id, p_name: nm });
      if (data){ const l = SEEN.get(c.id) || []; if (!l.includes(nm)) l.push(nm); SEEN.set(c.id, l); flash("Thanks, " + nm.split(" ")[0] + "!"); render(); } };
    if (ME) return send(ME.name);

    const onToday = [...new Set(sc.shifts.filter(x => x.d === today && !x.off).map(x => pname(x.p)).filter(Boolean))];

      everyone.length ? h("div", { class:"names" }, everyone.map(nm => h("button", { type:"button", text: nm, class: onToday.includes(nm) ? "today" : "", onclick: () => { wrap.remove(); send(nm); } })))
        : h("p", { class:"sub-note", text:"Everyone on the schedule has already tapped Got it." }),
      h("button", { class:"back", type:"button", text:"Cancel", onclick: () => wrap.remove() })));
    document.body.append(wrap);
  }
  // On a staff member's own phone: hello and their next shift, first thing.
  function meHero(){
    if (!ME) return null;
    const sc = S(), today = localDay(), first = ME.name.split(" ")[0];
    const mine = (sc.shifts || []).filter(x => x.p === ME.key && x.d >= today && !x.off).sort((a, b) => a.d.localeCompare(b.d) || String(a.s || "").localeCompare(String(b.s || "")));
    const nx = mine[0], when = d => d === today ? "Today" : d === addDays(today, 1) ? "Tomorrow" : DOWL[new Date(d + "T12:00:00").getDay()];
    const label = x => t12(x.s) + " \u2013 " + (x.e ? t12(x.e) : "close") + (x.r ? " \u00b7 " + roleLabel(x.r) : "");

  try { JSON.parse(localStorage.getItem(CACHE + "-ph") || "[]").forEach(([k, v]) => PH.set(k, v)); } catch(e){}
  $("q").addEventListener("input", e => { Q = e.target.value.trim(); if (location.hash === "#build") location.hash = ""; render(); });
  $("custom").onclick = () => { location.hash = "build"; };
  $("nav-rec").onclick = () => { location.hash = ""; };
  $("nav-sched").onclick = () => { location.hash = "sched"; };
  $("nav-duty").onclick = () => { location.hash = "duties"; };
  $("nav-ev").onclick = () => { location.hash = "events"; };

  // Keep the screen awake during service (where the tablet supports it).
  let lock = null, wantWake = false;
  async function wake(on){ wantWake = on; $("wake").setAttribute("aria-pressed", String(on));
    try { if (on && "wakeLock" in navigator){ lock = await navigator.wakeLock.request("screen"); } else if (lock){ await lock.release(); lock = null; } } catch(e){} }
  $("wake").onclick = () => wake(!wantWake);
  document.addEventListener("visibilitychange", () => { if (wantWake && document.visibilityState === "visible") wake(true); if (document.visibilityState === "visible") load(false); });
  if (!("wakeLock" in navigator)) $("wake").hidden = true;

  // ---------- Staff phones: personal link -> pick a PIN; later, open with the PIN ----------
  function pinPad(title, sub, onFull){
    const box = h("div", { class:"pp-dots", "aria-live":"polite" }), msg = h("p", { class:"pp-msg" }); let v = "";
    const draw = () => box.replaceChildren(...[0,1,2,3].map(i => h("span", { class: i < v.length ? "on" : "" })));
    const key = d => h("button", { type:"button", class:"pp-key", text: d, onclick: () => { if (d === "\u232b") v = v.slice(0, -1); else if (v.length < 4) v += d; draw(); if (v.length === 4){ const got = v; v = ""; setTimeout(draw, 150); onFull(got, t2 => { msg.textContent = t2 || ""; }); } } });
    draw();
    document.body.classList.add("pp-mode");
    $("main").replaceChildren(h("div", { class:"pp" }, h("img", { src:"/apple-touch-icon.png", alt:"", class:"pp-logo" }), h("h1", { text: title }), sub ? h("p", { class:"pp-sub", text: sub }) : null, box, msg,
      h("div", { class:"pp-pad" }, ["1","2","3","4","5","6","7","8","9","","0","\u232b"].map(d => d ? key(d) : h("span")))));
  }
  function staffDone(dev){ ME = { name: dev.name, key: dev.key }; SCH_ME = dev.key; try { localStorage.setItem(STAFF_KEY + "-until", String(Date.now() + 12 * 3600e3)); } catch(e){} }
  function showMe(){ const b = $("me"); if (!ME || !b) return; b.hidden = false; b.textContent = "\uD83D\uDD13 " + ME.name.split(" ")[0] + " \u00b7 Lock";
    b.onclick = () => { try { localStorage.removeItem(STAFF_KEY + "-until"); } catch(e){} location.reload(); }; }
  async function joinFlow(){
    if (!sb){ $("main").replaceChildren(h("div", { class:"msg", text:"Couldn't connect. Check your signal and open the link again." })); return; }
    const { data } = await sb.rpc("staff_invite_open", { p_token: JOIN });
    if (!data || !data.ok){ document.body.classList.add("pp-mode"); $("main").replaceChildren(h("div", { class:"pp" }, h("h1", { text:"This link has been used" }), h("p", { class:"pp-sub", text:"Each link works once. Ask your manager to send you a new one." }))); return; }
    const first = String(data.name).split(" ")[0];
    pinPad("Hi " + first + "!", "Pick a 4-digit PIN for " + data.kitchen + "\u2019s staff app.", (p1, say) => {
      pinPad("Type it again", "Just to make sure, " + first + ".", async (p2, say2) => {
        if (p2 !== p1){ say2("Those didn't match. Start over."); return setTimeout(joinFlow, 1200); }
        const { data: r } = await sb.rpc("staff_invite_accept", { p_token: JOIN, p_pin: p1 });
        if (!r || !r.ok) return say2(r && r.reason === "off" ? "The staff app is switched off. Ask your manager." : "That link has expired. Ask your manager for a new one.");
        try { localStorage.setItem(STAFF_KEY, JSON.stringify({ device: r.device, book: r.book, name: r.name, key: r.key })); localStorage.setItem(STAFF_KEY + "-new", "1"); } catch(e){}
        staffDone(r); location.replace("/tablet/" + r.book);
      });
    });
  }
  function pinGate(dev){
    pinPad("Hi " + String(dev.name).split(" ")[0] + "!", "Type your PIN.", async (pin, say) => {
      if (!sb) return say("No connection. Check your signal.");
      const { data: r } = await sb.rpc("staff_pin_login", { p_device: dev.device, p_pin: pin });
      if (r && r.ok){ staffDone(r); if (r.book !== dev.book){ dev.book = r.book; try { localStorage.setItem(STAFF_KEY, JSON.stringify(dev)); } catch(e){} return location.replace("/tablet/" + r.book); }
        document.body.classList.remove("pp-mode"); showMe(); return load(true); }
      if (r && r.reason === "device"){ try { localStorage.removeItem(STAFF_KEY); } catch(e){} return say("This phone was signed out. Ask your manager for a new link."); }
      if (r && r.reason === "locked") return say("Too many tries. Wait " + r.minutes + " minutes.");
      say("That PIN didn't match." + (r && r.left != null ? " " + r.left + (r.left === 1 ? " try" : " tries") + " left." : ""));
    });
  }
  function homeScreenTip(){
    let isNew = false; try { isNew = localStorage.getItem(STAFF_KEY + "-new") === "1"; } catch(e){}
    if (!isNew || window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const tip = h("div", { class:"hs-tip" }, h("b", { text:"Add this app to your home screen" }),
      h("span", { text: ios ? "Tap Share (the square with the arrow), then \u201cAdd to Home Screen.\u201d" : "Tap the menu (\u22ee), then \u201cAdd to Home screen.\u201d" }),
      h("button", { class:"back", type:"button", text:"Got it", onclick: () => { try { localStorage.removeItem(STAFF_KEY + "-new"); } catch(e){} tip.remove(); } }));
    document.addEventListener("click", function hide(e){ if (e.target.closest && !e.target.closest(".hs-tip") && document.querySelector(".pick")){ tip.remove(); document.removeEventListener("click", hide); } });
    document.body.append(tip);
  }
  (function start(){
    if (JOIN) return joinFlow();
    const dev = staffDev();
    if (dev && dev.book === token){
      let until = 0; try { until = +localStorage.getItem(STAFF_KEY + "-until") || 0; } catch(e){}
      if (until > Date.now()){ staffDone(dev); showMe(); homeScreenTip(); return load(true); }
      return pinGate(dev);
    }
    load(true);
  })();
  setInterval(() => load(false), 3 * 60 * 1000);
})();
</script>
</body>
</html>
